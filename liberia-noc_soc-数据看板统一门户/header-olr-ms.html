<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLR MS Management Platform · Header (1340 × 70)</title>
<!--
  ============================================================================
  OLR MS Management Platform — 企业级网络管理平台 Header
  画布：1340px × 70px   |   纯 HTML + CSS + SVG，零图片、零 CDN、断网可用
  ----------------------------------------------------------------------------
  规格对照
    · Header 高度        70px
    · 背景               linear-gradient(90deg, #071A46, #0D2860)
    · Logo 区域宽度      约 165px（左侧 20px 内边距 + 145px 品牌区）
    · Logo               SVG 绘制，58 × 58 圆角蓝色方形（圆角 9px ≈ 15%），深蓝→亮蓝渐变 +
                         玻璃质感 + 柔和阴影，内含抽象 Z + 橙金色/浅蓝色双流线轨道
    · 字标               ZTE，26px / 800 / ZTE Blue (新) #0078D4（Logo 与字标间距 13px）
    · 分隔线             1px 青蓝色竖线（品牌区与标题区之间）
    · 主标题             OLR(#FF9D1C) + MS Management Platform(#FFFFFF)，24px / 700，单行，垂直居中
    · 副标题             12px / #9DB8E8 / margin-top 4px
    · 背景装饰           右下角 2~3 条蓝色弧形科技流线，透明度 .30~.60，pointer-events:none 且不遮挡文字
    · 响应式             整块画布按视口等比缩放（transform: scale）
  ----------------------------------------------------------------------------
  嵌入到真实门户时：把 <header class="olr-header"> 整块（含 .olr-header__bg）
  搬走即可；外层 .olr-stage / .olr-scaler 只是本预览页用来演示等比缩放的容器。
  ============================================================================
-->
<style>
  /* ---------- 设计令牌 ---------- */
  :root{
    --olr-canvas-w: 1340px;      /* 画布宽 */
    --olr-header-h: 70px;        /* Header 高 */
    --olr-brand-w:  145px;       /* 品牌区宽（+ 左内边距 20px = 165px） */
    --olr-pad-l:    20px;
    --olr-pad-r:    24px;
    --olr-gap-logo: 13px;
    --olr-gap-sep:  24px;

    --olr-navy-1:   #071A46;     /* 渐变起 */
    --olr-navy-2:   #0D2860;     /* 渐变止 */
    --olr-orange:   #FF9D1C;     /* OLR */
    --olr-white:    #FFFFFF;
    --olr-sub:      #9DB8E8;     /* 副标题 */
    --olr-cyan:     #47ADEF;     /* 分隔线（取自参考图实测 #47ADEF） */
    --olr-brand-blue:#0078D4;    /* ZTE 字标：ZTE Blue (新) 主品牌色，旧版 #0067B9 */

    --olr-font: "Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  /* ---------- 预览页外壳（非 Header 本体） ---------- */
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:40px 24px;
    background:#EEF3FA;
    font-family:var(--olr-font);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .demo-meta{
    width:100%;
    max-width:var(--olr-canvas-w);
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    letter-spacing:.2px;
    color:#64748B;
  }
  .demo-meta__dot{
    width:7px;height:7px;border-radius:50%;
    background:#FF9D1C;
    flex:0 0 7px;
  }
  .demo-meta__sep{ flex:0 0 1px; width:1px; height:11px; background:#C8D4E4; }
  .demo-hint{
    width:100%;
    max-width:var(--olr-canvas-w);
    margin:0;
    font-size:12px;
    line-height:1.7;
    color:#8494A8;
  }
  .demo-hint code{
    font-family:Consolas,"SF Mono",Menlo,monospace;
    font-size:11.5px;
    color:#5A6B80;
    background:#E3EAF4;
    border-radius:3px;
    padding:1px 5px;
  }

  /* ---------- 等比缩放舞台：保证 1340×70 设计稿在任意视口下按比例缩放 ---------- */
  .olr-stage{
    width:100%;
    max-width:var(--olr-canvas-w);
    height:calc(var(--olr-header-h) * var(--olr-scale,1));
    overflow:hidden;               /* JS 不可用时的兜底：裁切而不是撑破布局 */
  }
  .olr-scaler{
    width:var(--olr-canvas-w);
    height:var(--olr-header-h);
    transform:scale(var(--olr-scale,1));
    transform-origin:top left;
  }

  /* ==========================================================================
     Header 本体
     ========================================================================== */
  .olr-header{
    position:relative;
    width:100%;
    height:var(--olr-header-h);
    display:flex;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(90deg,#071A46,#0D2860);
    /* 1px 底部分隔发丝线：用 inset 阴影实现，不占布局高度，Header 恒为 70px */
    box-shadow:inset 0 -1px 0 rgba(120,170,255,.14);
    isolation:isolate;
  }

  /* ---------- 背景装饰层（右下角弧形流线） ---------- */
  .olr-header__bg{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;           /* 纯装饰，不拦截任何交互 */
    overflow:hidden;
  }
  .olr-header__bg svg{
    position:absolute;
    right:0;
    bottom:0;
    display:block;
    width:760px;
    height:70px;
  }

  /* ---------- 内容层 ---------- */
  .olr-header__inner{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    width:100%;
    height:100%;
    padding:0 var(--olr-pad-r) 0 var(--olr-pad-l);
  }

  /* 品牌区：Logo + ZTE，固定 145px（含左侧 20px 内边距后 = 165px） */
  .olr-brand{
    flex:0 0 var(--olr-brand-w);
    display:flex;
    align-items:center;
    gap:var(--olr-gap-logo);
    min-width:0;
  }
  .olr-brand__logo{
    flex:0 0 58px;
    width:58px;
    height:58px;
    display:block;
    line-height:0;
    /* 柔和阴影：只给底牌一层很浅的落影，不做厚重投影 */
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.45));
  }
  .olr-brand__logo svg{ display:block; width:58px; height:58px; }
  .olr-brand__word{
    font-size:26px;
    font-weight:800;               /* 参考图字标更重，用 800 贴近 */
    line-height:1;
    letter-spacing:.6px;
    color:var(--olr-brand-blue);   /* ZTE Blue (新) #0078D4，不是白色 */
    white-space:nowrap;
  }

  /* 品牌区 / 标题区 之间的细青蓝色竖线（参考图约 65% Header 高、实心不发虚） */
  .olr-brand-sep{
    flex:0 0 1px;
    width:1px;
    height:44px;
    background:linear-gradient(180deg,
      rgba(71,173,239,.35) 0%,
      var(--olr-cyan) 12%,
      var(--olr-cyan) 88%,
      rgba(71,173,239,.35) 100%);
  }

  /* 标题区 */
  .olr-brand-text{
    display:flex;
    flex-direction:column;
    justify-content:center;
    margin-left:var(--olr-gap-sep);
    min-width:0;
  }
  .olr-title{
    margin:0;
    font-size:24px;
    font-weight:700;
    line-height:28px;
    letter-spacing:.4px;
    color:var(--olr-white);
    white-space:nowrap;            /* 单行显示 */
  }
  .olr-title__olr{ color:var(--olr-orange); }
  .olr-subtitle{
    margin:4px 0 0;                /* margin-top:4px */
    font-size:12px;
    font-weight:400;
    font-style:italic;             /* 参考图副标题是斜体 */
    line-height:14px;
    letter-spacing:.9px;           /* 参考图字距明显更松 */
    color:var(--olr-sub);
    white-space:nowrap;
  }
</style>
</head>
<body>

<div class="demo-meta">
  <span class="demo-meta__dot" aria-hidden="true"></span>
  <span>OLR MS Management Platform · Header</span>
  <span class="demo-meta__sep" aria-hidden="true"></span>
  <span id="scaleInfo">1340 × 70 · 100%</span>
</div>

<!-- ===================== BEGIN: OLR MS Header ===================== -->
<div class="olr-stage" id="olrStage">
  <div class="olr-scaler">

    <header class="olr-header" role="banner">

      <!-- 背景装饰：右下角 3 条蓝色弧形科技流线（透明度 .30 / .42 / .58），不遮挡文字 -->
      <div class="olr-header__bg" aria-hidden="true">
        <svg viewBox="0 0 760 70" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <defs>
            <!-- 流线渐变：左下隐去 → 右上渐亮，制造“流动”方向感 -->
            <linearGradient id="olrArcA" gradientUnits="userSpaceOnUse" x1="380" y1="70" x2="760" y2="0">
              <stop offset="0%"   stop-color="#2E6FE0" stop-opacity="0"/>
              <stop offset="42%"  stop-color="#4FA6FF" stop-opacity=".85"/>
              <stop offset="100%" stop-color="#8FE0FF" stop-opacity="1"/>
            </linearGradient>
            <linearGradient id="olrArcB" gradientUnits="userSpaceOnUse" x1="380" y1="70" x2="760" y2="0">
              <stop offset="0%"   stop-color="#2E6FE0" stop-opacity="0"/>
              <stop offset="50%"  stop-color="#3F8BFF" stop-opacity=".8"/>
              <stop offset="100%" stop-color="#6FC6FF" stop-opacity="1"/>
            </linearGradient>
            <linearGradient id="olrArcC" gradientUnits="userSpaceOnUse" x1="380" y1="70" x2="760" y2="0">
              <stop offset="0%"   stop-color="#24509E" stop-opacity="0"/>
              <stop offset="55%"  stop-color="#2F6FD8" stop-opacity=".8"/>
              <stop offset="100%" stop-color="#4E9BF5" stop-opacity="1"/>
            </linearGradient>
            <!-- 右下角极淡的辉光，给弧形流线一个“光源” -->
            <radialGradient id="olrCornerGlow" gradientUnits="userSpaceOnUse" cx="700" cy="70" r="360">
              <stop offset="0%"   stop-color="#2F7BFF" stop-opacity=".26"/>
              <stop offset="100%" stop-color="#2F7BFF" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <rect x="0" y="0" width="760" height="70" fill="url(#olrCornerGlow)"/>

          <!-- 三条同心大半径圆弧，圆心落在画布右下角外侧 → 呈现向右下角收拢的科技流线 -->
          <circle cx="860" cy="330" r="500" fill="none" stroke="url(#olrArcC)" stroke-width="2.2" opacity=".30"/>
          <circle cx="860" cy="330" r="420" fill="none" stroke="url(#olrArcB)" stroke-width="2.8" opacity=".42"/>
          <circle cx="860" cy="330" r="345" fill="none" stroke="url(#olrArcA)" stroke-width="3.4" opacity=".58"/>
        </svg>
      </div>

      <!-- 内容：品牌区 ─ 竖线 ─ 标题区 -->
      <div class="olr-header__inner">

        <div class="olr-brand">
            <!-- Logo：58×58 圆角蓝色方形 + 抽象 Z + 橙金/浅蓝流线轨道
                 ⚠️ 默认用官方品牌资产 PNG（assets/logo/，已裁到内容框、带透明角、降到 2x/3x）。
                    想切回「纯 SVG、零图片」版本：删掉下面这个 <img>，把紧随其后的
                    <span class="olr-brand__logo olr-brand__logo--svg"> 的 style="display:none" 去掉即可。
                 两个版本的尺寸/对齐完全一致，都占 58×58。 -->
            <!-- 图标直接内联为 data URI：HTML 单文件自包含，不依赖任何外部请求，
                 因此在 file:// 直接打开、GUI 预览、门户服务器、单独拷走 HTML 等
                 任何环境下都能正常显示（相对路径在这些场景下会 404）。
                 需要外部文件版（便于门户打包/缓存）时，把 src 换回：
                   src="assets/logo/zte-z-116.png"
                   srcset="assets/logo/zte-z-116.png 2x, assets/logo/zte-z-174.png 3x"
                 两个文件都在 assets/logo/ 下，116=2x、174=3x，均已无损压缩。 -->

            <!-- 备用：纯 SVG 版 Logo（默认隐藏）
                 · 底牌：深蓝 → 亮蓝 对角渐变，顶部一层极淡白色高光 + 底部亮蓝辉光 = 玻璃质感
                 · 轨道：橙金色内环 + 浅蓝色外环，同心同倾角（rotate(-18 29 29)），靠半径差拉开
                 · 每条轨道拆成“远侧半环 / 近侧半环”，分别压在 Z 字形下方与上方，
                   才有“环环绕字形”的立体感；整条 ellipse 画出来只会贴在字面上。
                 · 柔和阴影在 CSS 里用 filter:drop-shadow 给，不写进 SVG。 -->
            <span class="olr-brand__logo olr-brand__logo--svg" style="display:none">
            <svg viewBox="0 0 58 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ZTE" focusable="false">
              <defs>
                <!-- 底牌：深蓝 → 亮蓝 对角渐变（参考图左上角最亮、四周压深） -->
                <linearGradient id="olrLogoBg" x1=".05" y1="0" x2=".8" y2="1">
                  <stop offset="0%"   stop-color="#3E78E0"/>
                  <stop offset="42%"  stop-color="#1E3591"/>
                  <stop offset="100%" stop-color="#121A50"/>
                </linearGradient>
                <!-- 玻璃质感：底部亮蓝内辉光 + 顶部极淡白色高光 -->
                <radialGradient id="olrLogoGlow" cx="50%" cy="90%" r="70%">
                  <stop offset="0%"   stop-color="#6FA8E8" stop-opacity=".45"/>
                  <stop offset="100%" stop-color="#6FA8E8" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="olrLogoGloss" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".14"/>
                  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                </linearGradient>
                <!-- Z 正面：浅蓝 → 中蓝 -->
                <linearGradient id="olrLogoZFace" x1=".1" y1="0" x2=".85" y2="1">
                  <stop offset="0%"   stop-color="#B4E4FE"/>
                  <stop offset="45%"  stop-color="#8FD2FC"/>
                  <stop offset="100%" stop-color="#6FA9F0"/>
                </linearGradient>
                <!-- Z 厚度面：深海军蓝，做出往右下延伸的立体厚度 -->
                <linearGradient id="olrLogoZDepth" x1=".1" y1="0" x2=".8" y2="1">
                  <stop offset="0%"   stop-color="#2A3A9E"/>
                  <stop offset="100%" stop-color="#131A50"/>
                </linearGradient>
                <!-- 橙金色轨道 -->
                <linearGradient id="olrLogoRing" x1="0" y1="1" x2="1" y2="0">
                  <stop offset="0%"   stop-color="#D9690A"/>
                  <stop offset="45%"  stop-color="#FF9D1C"/>
                  <stop offset="100%" stop-color="#FFCB80"/>
                </linearGradient>
                <!-- 浅蓝色轨道 -->
                <linearGradient id="olrLogoRing2" x1="0" y1="1" x2="1" y2="0">
                  <stop offset="0%"   stop-color="#5FB4F0"/>
                  <stop offset="55%"  stop-color="#A6DDFF"/>
                  <stop offset="100%" stop-color="#E4F6FF"/>
                </linearGradient>
                <!-- 高光只画在圆角底牌内部，避免圆角处露出直角边界 -->
                <clipPath id="olrLogoClip"><rect width="58" height="58" rx="10"/></clipPath>
              </defs>

              <!-- 圆角蓝色方形底牌：58 × 58，圆角 10px ≈ 17%（规格“约 15%”） -->
              <rect x="0" y="0" width="58" height="58" rx="10" fill="url(#olrLogoBg)"/>
              <g clip-path="url(#olrLogoClip)">
                <rect width="58" height="58" fill="url(#olrLogoGlow)"/>
                <rect x="0" y="0" width="58" height="26" fill="url(#olrLogoGloss)"/>
              </g>
              <!-- 1.2px 内描边 = 玻璃边缘的高光，不是边框 -->
              <rect x=".6" y=".6" width="56.8" height="56.8" rx="9.4"
                    fill="none" stroke="#FFFFFF" stroke-opacity=".20" stroke-width="1.2"/>

              <!-- 浅蓝轨道 · 远侧半环（外环，在字形下方） -->
              <path d="M1.5 29 A27.5 9.6 0 0 1 56.5 29"
                    fill="none" stroke="url(#olrLogoRing2)" stroke-width="1.6"
                    stroke-linecap="round" opacity=".8" transform="rotate(-18 29 29)"/>

              <!-- 橙金轨道 · 远侧半环（内环，在字形下方） -->
              <path d="M5 29 A24 6.4 0 0 1 53 29"
                    fill="none" stroke="url(#olrLogoRing)" stroke-width="4"
                    stroke-linecap="round" opacity=".95" transform="rotate(-18 29 29)"/>

              <!-- 抽象 Z 字母：x 11..47 / y 13..45，横杠 10 厚；
                   斜杠水平位移 19、垂直位移 12 → 与横杠等视觉线宽（约 9.1）。
                   立体感 = 同一路径先往右下平移 3.6 画一层“厚度面”，再叠正面浅蓝渐变。 -->
              <path d="M11 13 H47 V23 L28 35 H47 V45 H11 V35 L30 23 H11 Z"
                    transform="translate(3.6 3.6)" fill="url(#olrLogoZDepth)"/>
              <path d="M11 13 H47 V23 L28 35 H47 V45 H11 V35 L30 23 H11 Z"
                    fill="url(#olrLogoZFace)"/>

              <!-- 橙金轨道 · 近侧半环（内环，在字形上方） -->
              <path d="M53 29 A24 6.4 0 0 1 5 29"
                    fill="none" stroke="url(#olrLogoRing)" stroke-width="4"
                    stroke-linecap="round" transform="rotate(-18 29 29)"/>

              <!-- 浅蓝轨道 · 近侧半环（外环，在字形上方） -->
              <path d="M56.5 29 A27.5 9.6 0 0 1 1.5 29"
                    fill="none" stroke="url(#olrLogoRing2)" stroke-width="1.6"
                    stroke-linecap="round" opacity=".8" transform="rotate(-18 29 29)"/>
            </svg>
            </span>

<p class="demo-hint">
  画布 1340 × 70，整块按视口等比缩放（<code>transform: scale()</code>）。嵌入门户时把
  <code>&lt;header class="olr-header"&gt;</code> 连同内部背景层搬走即可，外层
  <code>.olr-stage / .olr-scaler</code> 只是本页的预览容器。
</p>

<script>
(function () {
  var DESIGN_W = 1340;
  var stage = document.getElementById('olrStage');
  var info  = document.getElementById('scaleInfo');

  function fit() {
    // 视口可用宽度（扣掉页面左右各 24px 内边距），等比缩放到不超过 1
    var avail = document.documentElement.clientWidth - 48;
    var scale = Math.min(1, Math.max(0.25, avail / DESIGN_W));
    scale = Math.round(scale * 1000) / 1000;
    stage.style.setProperty('--olr-scale', scale);
    if (info) info.textContent = DESIGN_W + ' × 70 · ' + Math.round(scale * 100) + '%';
  }

  fit();
  window.addEventListener('resize', fit, { passive: true });
  window.addEventListener('orientationchange', fit, { passive: true });
})();
</script>
