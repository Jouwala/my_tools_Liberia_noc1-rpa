<head>

<!-- 零 CDN：图标与看板目录都从 /MsPortal/ 只读引用，本页面不写它的任何文件 -->
<link rel="stylesheet" href="/MsPortal/assets/icons/phosphor.css">
<link rel="stylesheet" href="assets/olbr.css">
<!-- QC 下钻弹窗的统一外壳（2026-09-23 加）。与 /MsPortal/ 引的是**同一个文件** ——
     这是「两个门户的下钻弹窗长相与交互一致」的实现方式：一份 qcDrill.css，
     两边同名同类。文件内部只用 --qc-* 变量，本页由下面 assets/olbr.css 末尾的
     映射块灌入本页主题色，所以弹窗结构与 MsPortal 逐条一致，而深浅色仍随本页。
     排在 olbr.css 之后：万一有同特异性的旧规则，以本文件为准。 -->
<link rel="stylesheet" href="/MsPortal/assets/qcDrill.css">
<!-- 主题/语言在首帧前落到 <html>，避免闪白。
   键名刻意用 olbr.* 而不是复用 msportal.* —— 两个页面各自记忆各自的选择，
   并且本页面**不持久化搜索与筛选**（MsPortal 那版会把上一次的筛选带进下次
   会话，7 个面板看起来像坏了，这是本次改版要修掉的一类问题）。
   没有用户选择时按浏览器语言定默认（与 my_app 的 detectLocale 同一口径）——
   之前硬默认中文，利比里亚用户第一次打开满屏中文、必须先找到语言开关。
   这段和 title/meta 的覆写与 assets/olbr.js 的 detectLang() 必须保持一致，
   两边不一致会让首帧和挂载后的语言不同，表现为闪一下另一种语言。 -->
<script>
(function () {
  function guessLang() {
    var v = null;
    try { v = localStorage.getItem('olbr.lang'); } catch (e) { /* ignore */ }
    if (v === 'en' || v === 'zh') return v;
    var nav = (navigator.language || navigator.userLanguage || 'zh') + '';
    return nav.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
  }
  try {
    if (localStorage.getItem('olbr.theme') === 'dark') document.documentElement.classList.add('dark');
  } catch (e) { /* ignore */ }
  document.documentElement.setAttribute('lang', guessLang() === 'en' ? 'en' : 'zh-CN');
})();
</script>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">跳到主内容</a>

<!-- ===================== masthead ===================== -->

    <div class="globe">

            <stop offset="10%" stop-color="#17579f"></stop>
            <stop offset="26%" stop-color="#0d3672"></stop>
            <stop offset="48%" stop-color="#082450"></stop>
            <stop offset="76%" stop-color="#05152f"></stop>
            <stop offset="100%" stop-color="#03101f"></stop>

            <stop offset="68%" stop-color="#f2ffff" stop-opacity="1"></stop>
            <stop offset="82%" stop-color="#9fe6ff" stop-opacity=".8"></stop>
            <stop offset="100%" stop-color="#3f92f0" stop-opacity=".25"></stop>
          </linearGradient>
          <pattern id="gDot" width="1.35" height="1.35" patternUnits="userSpaceOnUse">
            <circle cx=".67" cy=".67" r=".3" fill="#8fd8ff" fill-opacity=".22"></circle>
          </pattern>
          <pattern id="gLand" width="1.35" height="1.35" patternUnits="userSpaceOnUse">
            <circle cx=".67" cy=".67" r=".36" fill="#cdf4ff" fill-opacity=".7"></circle>
          </pattern>
          <clipPath id="gClip"><circle cx="100" cy="100" r="98"></circle></clipPath>
        </defs>
        <circle cx="100" cy="100" r="101" fill="none" stroke="#5aa8f0" stroke-opacity=".16" stroke-width="1"></circle>
        <circle cx="100" cy="100" r="98" fill="url(#gBody)"></circle>
        <g clip-path="url(#gClip)">
          <circle cx="100" cy="100" r="98" fill="url(#gDot)"></circle>
          <g fill="url(#gLand)">
            <path d="M56 32 L64 20 L80 14 L98 18 L107 26 L100 35 L86 40 L68 41 Z"></path>
            <path d="M118 26 L127 15 L146 12 L163 18 L168 28 L156 36 L136 39 L123 34 Z"></path>
            <path d="M28 38 L38 29 L50 32 L54 41 L42 45 L32 44 Z"></path>
          </g>
          <g fill="none" stroke="#8fd8ff" stroke-opacity=".09" stroke-width=".55">
            <ellipse cx="100" cy="100" rx="30" ry="98"></ellipse>
            <ellipse cx="100" cy="100" rx="62" ry="98"></ellipse>
            <ellipse cx="100" cy="100" rx="98" ry="30"></ellipse>
          </g>
        </g>
        <circle cx="100" cy="100" r="97.5" fill="none" stroke="url(#gRim)" stroke-width="2.6"></circle>
      </svg>
    </div>
  </div>

  <div class="mast-in wrap">
    <div class="brand">
      <img class="mark" src="/MsPortal/assets/logo-zte-z-116.png"
           srcset="/MsPortal/assets/logo-zte-z-116.png 2x, /MsPortal/assets/logo-zte-z-174.png 3x"
           alt="ZTE" decoding="async">
      <span class="word-zte">ZTE</span>
      <span class="brand-sep" aria-hidden="true"></span>
      <h1 class="title"><span class="t-olr">OLR</span><span class="t-ms"> MS</span><span class="t-tail"> Management Platform</span></h1>
      <p class="tagline" data-i18n="tagline">Smarter Operations · Higher Efficiency · Better Network</p>
    </div>

    <nav class="tools" aria-label="Tools">
      <span class="env" id="envBadge"><i class="env-dot" aria-hidden="true"></i><span id="envLabel">—</span></span>
      <time class="clock" id="clock">--:--:--</time>
      <span class="tools-sep" aria-hidden="true"></span>
      <span class="seg" role="group" aria-label="Language">
        <button type="button" class="seg-b" data-lang="zh">中文</button>
        <button type="button" class="seg-b" data-lang="en">EN</button>
      </span>
      <button type="button" class="ib" id="themeBtn" aria-label="Toggle theme"
              data-i18n-attr="title:attr.theme">

      </button>

              data-i18n-attr="title:edit.tipOn">

      <!-- 用户管理：只对「真门户管理员」显示（olbr.js renderWho 里判 role + id）。

      <button type="button" class="gb" id="umBtn" hidden data-i18n-attr="title:um.entryTip">
        <i class="ph ph-shield-check" aria-hidden="true"></i><span data-i18n="um.entry">用户管理</span>

        <i class="ph ph-wrench" aria-hidden="true"></i><span data-i18n="mast.admin">管理门户</span>
      </a>
      <a class="gb" href="/uniplam/">
        <i class="ph ph-map-pin" aria-hidden="true"></i><span data-i18n="mast.uni">统一门户</span>
      </a>
      <span class="who" id="whoBadge" hidden></span>
      <button type="button" class="gb" id="logoutBtn" hidden>

<!-- ===================== 编辑模式提示条 =====================
     只有点了顶栏「编辑分组」才出现。它不是装饰：这一页的编辑改动写进的是
     /api/portal-catalog 的**全局共享**目录，MsPortal 的用户刷新就能看到，
     所以第一眼必须说清楚「你现在动的是公共数据」，以及三种落点各是什么。 -->
<div class="editbar wrap" id="editBar" hidden>
  <span class="eb-k" data-i18n="edit.bannerK">编辑模式</span>
  <span class="eb-t" data-i18n="edit.banner"></span>
  <span class="eb-h edit-hint"></span>
  <button type="button" class="gb eb-x edit-leave" data-act="edit-leave">退出编辑</button>
</div>

<!-- ===================== 检索轨：默认收起成一条，点「搜索与筛选」才展开 =====================
     2026-09-22 改：原先整条常驻展开（≈94px），首页一进来先被它吃掉两行。收起态照样把
     「有没有在筛选」讲清楚 —— 条上写命中数和筛选条件，并留一颗「清除筛选」，
     否则下面的卡少了几张会被当成系统问题。展开状态不持久化：每次进来都是收起。
     清除按钮只有这一颗（从 .rail-end 移到了条上），展开态也在同一行，不重复绑事件。 -->
<div class="rail" id="rail">
  <div class="rail-bar wrap">
    <button type="button" class="rail-t" id="railBtn" aria-expanded="false" aria-controls="railIn"
            data-i18n-attr="title:rail.tip">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
      <span data-i18n="rail.btn">搜索与筛选</span>
      <i class="ph ph-caret-down rail-cv" aria-hidden="true"></i>
    </button>
    <span class="rail-sum" id="railSum"></span>
    <button type="button" class="gb" id="clearBtn" hidden>
      <i class="ph ph-x" aria-hidden="true"></i><span data-i18n="rail.clear">清除筛选</span>
    </button>
  </div>
  <div class="rail-in wrap" id="railIn" hidden>
    <label class="q">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
      <input type="search" id="q" autocomplete="off" spellcheck="false"
             aria-label="搜索看板"
             data-i18n-attr="placeholder:search.ph,aria-label:attr.searchAria">
      <kbd class="kbd">Ctrl K</kbd>
    </label>
    <div class="chips" id="chips" role="group" aria-label="分组筛选" data-i18n-attr="aria-label:attr.chipsAria"></div>
    <div class="rail-end">
      <span class="seg" role="group" aria-label="状态筛选" data-i18n-attr="aria-label:attr.statusAria">
        <button type="button" class="seg-b" data-status="all" data-i18n="rail.all">全部</button>
        <button type="button" class="seg-b" data-status="online">Online</button>
        <button type="button" class="seg-b" data-status="beta">Beta</button>
      </span>
      <span class="count" id="count">—</span>
    </div>
  </div>
</div>

<main id="main" class="wrap">
  <section id="gate" hidden></section>

  <!-- L0 · 决策带：达标率 + 六个实时指标 -->
  <section class="band" id="band" aria-label="Quality Control"></section>

  <!-- 宽屏（≥1600）时这三块进同一个栅格：地图让出一半宽度，右边给 L1 页签；
       升级带整宽压在下面一行。窄于 1600 就退回 DOM 顺序的上下排布。 -->
  <div class="stage">
    <!-- L0 · 焦点区：左栏 CXO 焦点卡 + SP 行式清单，右边地图 -->
    <div class="l0" id="l0"></div>

    <!-- 升级机制：默认收成一条 52px 值班带，展开才出全表（原来常驻 583px） -->
    <section class="esc" id="esc" aria-label="Escalation Matrix"></section>

    <!-- L1 · 业务视图：MS / FLM / FO / BO 一组一个页签，一次只展开一个。
         .vcol 是宽屏那套「等高」机制的定位上下文，本身不装内容 -->
    <div class="vcol"><div id="views"></div></div>
  </div>

  <!-- L2 · 辅助入口：去卡片化，无边框无色块，只留标题与行链接 -->
  <section class="aux" id="aux" aria-label="Auxiliary"></section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span>© 2026 ZTE Corporation · <span data-i18n="foot.branch">利比里亚办事处网络运营中心 (OLR MS)</span></span>
    <span class="foot-r">
      <span class="ok"><i class="ph ph-shield-check" aria-hidden="true"></i> <span data-i18n="foot.ok">安全合规模式运行</span></span>
      <span id="footSrc">—</span>
      <span class="ver" data-i18n="foot.ver">Ver 1.0-OLBR · 只读展示版</span>
    </span>
  </div>
</footer>

<!-- ===================== QC 下钻弹窗（统一下钻弹窗前 = 右侧抽屉） =============
     2026-09-23 改版：由「右侧滑入抽屉 .drawer + table.grid」换成与
     /MsPortal/ **逐类一致**的居中弹窗（.qc-mask / .qc-modal / …），
     样式来自两边共引的 /MsPortal/assets/qcDrill.css。

     为什么统一：两个门户的 QC 卡取自同一个接口（/api/portal-qc/detail，
     同样的 total/rows/columns），此前却是两种长相、两种能力 ——
     MsPortal 能排序 / 能导出 / 能跳完整看板，只读版都不能，
     同一个数字点开像是两个系统。

     为什么类名用 .qc-* 而不是复用本页的 .gp/.toast：
     那套是本页私有的浮层样式，.qc-* 是 qcDrill.css 的独立命名空间，
     两边同名同类，改一处两边同时生效。

     id 与 MsPortal 的 QcDrillModal **完全同名**：qcMask / qcTitle / qcSearch /
     qcReload / qcExport / qcOpenBoard / qcThead / qcTbody / qcCount / qcPage /
     qcPrev / qcNext / qcClose —— 两份 index.html 可以直接对着 diff。
     ======================================================================== -->
<div class="qc-mask" id="qcMask" hidden>
  <div class="qc-modal" role="dialog" aria-modal="true" aria-labelledby="qcTitle">
    <div class="qc-head">
      <!-- 拖动抓手：标题栏整体可拖（cursor:move），这条纹理让「能拖」一眼可见。
           仅装饰，不参与任何事件逻辑，故 aria-hidden。与 MsPortal 同款。 -->
      <span class="qc-grip" aria-hidden="true"></span>
      <h3 id="qcTitle">Quality Control</h3>
      <button type="button" class="qc-x" id="qcClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="qc-body">
      <div class="qc-tools">
        <input type="search" id="qcSearch" autocomplete="off"
               data-i18n-attr="aria-label:attr.drQAria,placeholder:dr.qPh">
        <button type="button" class="qc-btn" id="qcReload" data-i18n="dr.reload">刷新</button>
        <!-- 导出：与 MsPortal 同一套 UNIFIED_EXCEL_V1（/MsPortal/assets/excelReport.js）。
             只读版原本没有导出，是这次统一补齐的能力之一。 -->
        <button type="button" class="qc-btn" id="qcExport" data-i18n="dr.export">导出 Excel</button>
        <!-- 跳到 my_app 里对应的完整看板继续处理。只给目录里确实存在对应看板的
             维度（alarm/tt/wo/spms）；cr/pmt 在 my_app 侧没有页面 ——
             配一个错的链接比不给链接更糟。href 与显隐由 olbr.js 设置。 -->
        <a class="qc-btn" id="qcOpenBoard" hidden target="_blank" rel="noopener"
           data-i18n="dr.openBoard">打开完整看板</a>
      </div>
      <div class="qc-scroll" id="qcScroll">
        <table class="qc-table">
          <thead id="qcThead"></thead>
          <tbody id="qcTbody"></tbody>
        </table>
      </div>
      <div class="qc-hint" data-i18n="dr.filterHint"></div>
    </div>
    <div class="qc-foot">
      <div class="qc-foot-in">
        <span class="qc-note" id="qcCount"></span>
        <span class="qc-pager">
          <button type="button" class="qc-btn" id="qcPrev">‹</button>
          <span class="qc-page" id="qcPage"></span>
          <button type="button" class="qc-btn" id="qcNext">›</button>
        </span>
      </div>
    </div>
  </div>
</div>

<!-- 编辑态的「分组归属」浮层：内容随点开的卡片生成（fixed 定位贴在卡片旁边，
     不用 modal —— 改归属时还得看见卡片本身，遮罩会把上下文全挡住） -->
<div class="gp" id="grpPop" hidden></div>

<!-- 编辑态的「改名」浮层：一级分组改名 / 新增分组 / 看板改标题共用这一颗（同一时刻只开一个） -->
<div class="gp gp--form" id="editPop" hidden></div>

<!-- ===================== 用户管理弹窗（2026-09-22 加） =====================
     与 http://localhost/uniplam/ 的 UserManagementModal、/MsPortal/ 的移植版是
     **同一个用户库的第三个操作界面**：骨架只放静态壳子与固定按钮，表体 / 表单 /
     页面配置面板全部由 olbr.js 的 renderUserMgmt() 按 state.um 整块重画
     （输入到一半的值先落 state 再画，否则重绘会清掉用户正在敲的内容）。
     样式在 olbr.css 的 .um-* 段，走本页令牌，不引 MsPortal 的 portal.css。 -->
<div class="um-mask" id="umMask" hidden>
  <div class="um-modal" role="dialog" aria-modal="true" aria-labelledby="umTitle">
    <div class="um-head">
      <div class="um-head-txt">
        <h3 id="umTitle" data-i18n="um.title">用户管理</h3>
        <p class="um-sub" data-i18n="um.subtitle">统一门户账号的增删与权限设置（仅管理员可见，与 /uniplam/ 同库同步）</p>
      </div>
      <span class="um-head-actions">
        <button type="button" class="gb" id="umReload" data-i18n="um.reload">刷新</button>
        <a class="gb" id="umOpenPortal" href="/uniplam/" target="_blank" rel="noopener noreferrer"
           data-i18n="um.openPortal">在统一门户打开</a>
        <button type="button" class="ib" id="umClose" aria-label="Close">
          <i class="ph ph-x" aria-hidden="true"></i>
        </button>
      </span>
    </div>
    <div class="um-body" id="umBody"></div>
    <!-- 底部固定操作栏：放在滚动区之外，页面配置面板展开时「保存」常驻可见 -->
    <div class="um-foot" id="umFoot" hidden>
      <span class="um-foot-who" id="umFootWho"></span>
      <span class="um-foot-actions">
        <button type="button" class="gb" id="umCancelBtn" data-i18n="um.pagesCancel">收起</button>
        <button type="button" class="gb um-primary" id="umSaveBtn" data-i18n="um.pagesSave">保存页面配置</button>
      </span>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/MsPortal/assets/data.js"></script>
<script src="/MsPortal/assets/terms.js"></script>
<script src="/MsPortal/assets/access.js"></script>
<!-- 下钻弹窗的「导出 Excel」（2026-09-23 加）。与 MsPortal 用的是同一个文件、
     同一套格式 UNIFIED_EXCEL_V1 → 两个门户导出的表头 / 底纹 / 冻结行完全同款。

     刻意**不**在这里引 vendor/exceljs.min.js（约 0.9MB）：excelReport.js 内部会按
     自身脚本地址推出 assets/ 基址，点「导出」时才 loadExcelJS() 注入同目录的
     vendor/exceljs.min.js —— 本页以 /MsPortal/assets/excelReport.js 的绝对路径加载，
     所以那个相对推导结果是 /MsPortal/assets/vendor/… 命中同一个文件。
     多引一行只会让只读版首屏白白多下 0.9MB。 -->
<script src="/MsPortal/assets/excelReport.js"></script>
<!-- QC 下钻弹窗的拖动 / 点击位置定位（2026-09-23 加）。与 /MsPortal/ 共用同一个
     文件，行为逐条对齐 /myapp/ 的 DraggableClickModal：以点击位置为中心弹出、
     按住标题栏可拖、点遮罩不关闭。 -->
<script src="/MsPortal/assets/qcDrill.drag.js"></script>
<script src="assets/olbr.js"></script>
</body>
</html>
