<!-- 2026-09-25 改名：门户整体品牌统一为「ZTE OLR MS O&M Tools Platform」。
     2026-10-01 再改名：上述名字统一为「ZTE OLR MS Intelligent O&M Platform」。
     这里写的是**首帧文案**（olbr.js:3635 的 applyI18n 挂载后会按 doc.title 覆写），
     所以必须与 olbr-data.js 的两份 'doc.title' 保持一致，否则会闪一下旧标题。 -->
<title>ZTE OLR MS Intelligent O&amp;M Platform</title>

<!-- QC 下钻弹窗的统一外壳（2026-09-23 加）。与 /MsPortal/ 引的是**同一个文件** ——
     这是「两个门户的下钻弹窗长相与交互一致」的实现方式：一份 qcDrill.css，
     两边同名同类。文件内部只用 --qc-* 变量，本页由下面 assets/olbr.css 末尾的
     映射块灌入本页主题色，所以弹窗结构与 MsPortal 逐条一致，而深浅色仍随本页。
     排在 olbr.css 之后：万一有同特异性的旧规则，以本文件为准。 -->
<link rel="stylesheet" href="/MsPortal/assets/qcDrill.css">
<!-- 顶栏样式（2026-09-24 加）：让本页顶栏与 /MsPortal/ 长得一模一样。
     这是 MsPortal/assets/masthead.css **顶栏部分的副本**（见该文件头部说明），
     不是引用 —— 两边各自独立演进，将来 MsPortal 重做顶栏需手工同步。
     刻意排在 olbr.css **之后**：顶栏的 .seg / .seg-btn / .icon-btn / .btn-ghost
     与 olbr.css 的同名/近名规则同特异性，靠加载顺序定胜负，本文件要赢。
     注意：**没有**引 masthead.js —— 时钟、环境徽标、主题、语言这四件事
     olbr.js 已经全部接管，再引一份会出现两套实现抢同一个 DOM。 -->
<link rel="stylesheet" href="assets/masthead.css">
<!-- 主题/语言在首帧前落到 <html>，避免闪白。
   键名刻意用 olbr.* 而不是复用 msportal.* —— 两个页面各自记忆各自的选择，
   并且本页面**不持久化搜索与筛选**（MsPortal 那版会把上一次的筛选带进下次
   会话，7 个面板看起来像坏了，这是本次改版要修掉的一类问题）。
   没有用户选择时按浏览器语言定默认（与 my_app 的 detectLocale 同一口径）——
   之前硬默认中文，利比里亚用户第一次打开满屏中文、必须先找到语言开关。
   这段和 title/meta 的覆写与 assets/olbr.js 的 detectLang() 必须保持一致，
   两边不一致会让首帧和挂载后的语言不同，表现为闪一下另一种语言。 -->
<script>
/* ⚠️ 2026-09-30：本脚本是「首帧语言/主题」的落点，与 assets/olbr.js 里的
   detectLang()（约 L108）是**同一套判定规则的孪生实现** ——
   一个在首帧前跑（防止闪一下另一种语言/白色），一个在挂载后跑。
   改这里的 guessLang（默认语言、'zh' 前缀口径）或主题读取键名时，
   **必须同改 olbr.js 的 detectLang / state.theme**，否则首帧与挂载后不一致。 */
(function () {
  function guessLang() {
    var v = null;
    try { v = localStorage.getItem('olbr.lang'); } catch (e) { /* ignore */ }
    if (v === 'en' || v === 'zh') return v;
    var nav = (navigator.language || navigator.userLanguage || 'zh') + '';
    return nav.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
  }
  /* 主题：**用户显式选择优先，未选择时跟随系统**（2026-09-30 加）。
     原逻辑只认 localStorage 里的 'olbr.theme'，没有就一律浅色 ——
     于是系统是深色主题的用户第一次打开会被闪一下白底。
     新逻辑：读得到 'olbr.theme'（用户点过主题按钮留下的）→ 用它；
             读不到 → 用 matchMedia('(prefers-color-scheme: dark)') 跟随系统。
     ⚠️ 与 olbr.js 的 setTheme()/state.theme 是一套：那边 state.theme 直接读
        root 上的 .dark 类，所以只要这里在首帧把类设对，运行期就自动一致。
        改本段判定必须同改 olbr.js 的 detectTheme()（约 L118 起）。 */
  try {
    var saved = localStorage.getItem('olbr.theme');   // 'dark' | 'light' | null
    var wantDark = saved
      ? saved === 'dark'
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (wantDark) document.documentElement.classList.add('dark');
  } catch (e) { /* ignore */ }
  document.documentElement.setAttribute('lang', guessLang() === 'en' ? 'en' : 'zh-CN');
})();
</script>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">跳到主内容</a>

<!-- ===================== masthead =====================
     2026-09-24：整块换成 MsPortal 顶栏的**同款结构**（用户要求「和 /MsPortal/ 一样」）。
     样式来自 assets/masthead.css（MsPortal 那份的顶栏副本），本块只负责结构。

     ⚠️ 换结构时**刻意保留**的几处，都是为了不破坏 olbr.js 的绑定契约：
       · <header> 上的 `mast` 类：olbr.js 用 `$$('.mast .seg-b[data-lang]')`
         选语言按钮（olbr.js:4007 / 4103），**要求祖先有 .mast**。ms 那边叫 mp-mast，
         所以这里两个类都挂上。
       · 语言按钮同时挂 `seg-btn`（ms 的样式钩子）与 `seg-b`（olbr.js 的选中态钩子）。
       · id 一个都不能少：envBadge / envLabel / clock / themeBtn / editBtn /
         umBtn / whoBadge / logoutBtn —— 每个都有 JS 在绑（见 olbr.js:2667、2674、
         3323、4010、4012、4042、4052、4102、4106）。
       · #themeBtn 里**没有**放 ms 那对 .ic-moon/.ic-sun 内联 SVG：
         olbr.js:4010 每次切主题都会 `innerHTML =` 整个覆盖成 Phosphor 图标，
         放进去也会被冲掉，不如不放（原先就是 .ph 图标）。
       · #editBtn / #umBtn / #whoBadge / #logoutBtn 的 <i>+<span> 结构保留：
         olbr.js:2289-2291 会 querySelector('i') 与 ('span') 去改图标和文案。 -->
<header class="mp-mast mast" id="mast">
  <!-- 背景层：纯装饰，pointer-events:none -->
  <div class="mp-mast-bg" aria-hidden="true">
    <!-- ⚠️ 2026-09-28（用户要求「去掉中间的地球」）：这里原本是一颗装饰性大地球
         （.mp-globe，球缘青光 + 点阵大陆，比例是把参考图球缘像素逐行取最亮点后
         做最小二乘圆拟合量出来的）。整块已删除，连同上面对应的 SVG defs。
         保留下来的 .mp-mast-bg 还要继续承载本区其它背景层（渐变/网格等），
         所以**不要**顺手把 .mp-mast-bg 也删掉 —— 它没了会让顶栏整体变平。
         代码没有进版本库之外的地方：原 SVG 在 git 历史里，需要时 git show 可取回。
         注：MsPortal 那边有一份同名同款的 .mp-globe，用户只要求改本门户，故未动；
         两处是各自独立的文档，互不影响。 -->
  </div>

  <div class="mp-mast-inner">
    <!-- 品牌区 -->
    <div class="mp-brand">
      <span class="mp-zte-mark">
        <!-- ⚠️ 2026-09-28（用户要求「Header 中 ZTE 左边的图标换成 logo.png 的样子」）：
             原来是 MsPortal 的官方「蓝底 Z 标」（/MsPortal/assets/logo-zte-z-116.png），
             现在换成用户提供的那张图 —— 蓝橙双色的 OLR MS 徽标。
             资产放在**本目录自己的 assets 下**，不再跨目录引用 /MsPortal/：
             那张图是用户给本门户的，跟在别人目录里、由别人决定去留是错的依赖。
             源图 3101x2909 / 571KB，直接引用会让每次打开都白下半个 MB，
             已按顶栏实际渲染尺寸（--mp-brand-h ≈ 40px）降采样成 2x/3x 两档，
             文件名沿用 MsPortal 既有资产的后缀习惯（-116 / -174）便于对照。
             原图格式为 RGBA 方图，与 .mp-zte-mark 的 1:1 尺寸正好吻合，无需改版式。 -->
        <img src="assets/logo-olr-ms-116.png"
             srcset="assets/logo-olr-ms-116.png 2x, assets/logo-olr-ms-174.png 3x"
             alt="ZTE" decoding="async">
      </span>
      <!-- ⚠️ 2026-09-28（用户要求「用这张图里的 ZTE 替换 Header 里的 ZTE」）：
           原来是文字 <span class="mp-zte-word">ZTE</span>（1.75rem/800，靠系统字体渲染），
           现在换成用户提供的那张 ZTE 字标图抠出来的位图。
           资产放在**本目录自己的 assets 下**（与 logo-olr-ms-116/174 同一处），
           不跨目录引用 /MsPortal/：这张图是给本门户的，挂在别人目录里等于由别人决定去留。
           按顶栏实际字面高（1.75rem × 0.72 ≈ 20px）出 2x/3x（40/60px）两档。
           源图与处理脚本都在 TMP/_zte_logo/，将来换尺寸/换色/换图改那一个脚本重跑即可。

           ── 关于源图的两次更换（2026-09-28，用户先后给了两张图）──
           第一张是**实景照片**（331x194，斜拍弧面手写字）。那张图不是平面平行投影：
           六条横笔斜率从 +4.45° 跨到 +13.44°，且同一字母内部就不平行（Z 两条差 5.84°、
           E 三条差 3.58°）。仿射保持平行性所以无解；投影变换虽能消锥度，却会把字母宽高比
           改掉（实测 Z −41%、T +12%、E +14%）。最终只能逐字母按自己最长那条横笔摆平，
           残余集中在短笔画上取不掉。那段推理与脚本存档在 TMP/_zte_logo/_build_photo_legacy.py。
           第二张（**当前产物**）是 logo.png：干净的**数字字标**（326x188，纯白底，前景纯色
           #3589D0）。实测三个字母精确同高（都占 y20..165）、左右列 y 范围一致、横笔斜率
           ≤0.92° —— **图本来就是正的，不需要任何几何校正**，硬套上面那套摆正逻辑反而会引入误差。
           所以现用脚本 TMP/_zte_logo/_build_word.py 只做「去白底 + 按倍数降采样」两件事。

           ── 去白底为什么不会留白边 ──
           实测边缘像素到「主色 → 白」直线的距离 95 分位仅 1.03，说明图像就是
           「纯色前景 + 抗锯齿」的线性混合，于是可解 P = α·C + (1−α)·白 反推每个像素的 α
           （重建误差仅 2/255）。这样边缘像素保留的 RGB 就是纯主色，只有透明度不同。
           验收：半透明像素 RGB 与主色偏差均值 1.77；叠到顶栏最暗端 #051C42 后，
           没有任何像素亮过主色本身 → 无光晕。对照试验：若改用「离白距离 > 阈值」硬抠，
           会有 96 个像素亮于主色 —— 那正是白边光晕的来源，本脚本避免了它。
           span 上的 .mp-zte-word 类**保留**：它是排版钩子（与 Logo 居中对齐 + 三档断点缩放），
           olbr.js 从未引用过这个类，改名或删掉只会白白多一处 diff。 -->
      <span class="mp-zte-word">
        <img src="assets/logo-zte-word-40.png"
             srcset="assets/logo-zte-word-40.png 2x, assets/logo-zte-word-60.png 3x"
             alt="ZTE" decoding="async">
      </span>
      <span class="mp-brand-sep" aria-hidden="true"></span>
      <div class="mp-brand-text">
        <!-- 2026-09-25 改名：原「OLR MS Management Platform」→「ZTE OLR MS O&M Tools Platform」。
             2026-10-01 再改名：→「ZTE OLR MS Intelligent O&M Platform」（用户点名）。

             「O&M」的 & 必须写成 &amp;：这里是 HTML，裸 & 虽然浏览器能容错，

        <h1 class="mp-title"><span class="mp-title-olr">OLR</span> MS<span class="mp-title-tail"> Intelligent O&amp;M Platform</span></h1>

             这里保留原文只是为了在 JS 未加载时仍有一份可读的兜底文字。 -->
        <p class="mp-tagline" data-i18n="tagline">Ultimate Services · Leading Ecosystem</p>
      </div>

    <!-- 右侧工具区 -->
    <div class="mp-mast-tools">

<!-- ===================== 检索轨：默认收起成一条，点「搜索与筛选」才展开 =====================
     2026-09-22 改：原先整条常驻展开（≈94px），首页一进来先被它吃掉两行。收起态照样把
     「有没有在筛选」讲清楚 —— 条上写命中数和筛选条件，并留一颗「清除筛选」，
     否则下面的卡少了几张会被当成系统问题。展开状态不持久化：每次进来都是收起。
     清除按钮只有这一颗（从 .rail-end 移到了条上），展开态也在同一行，不重复绑事件。 -->
<div class="rail" id="rail">
  <!-- 2026-09-28（用户要求「查找和过滤组件的按钮和信息放到最右边」）：
       这一行原来是「按钮 + 命中数 + 清除筛选」三件东西从左往右紧挨着排。
       现在补一个 .rail-sp 弹性占位把它们整体推到右缘，与下面展开区里
       .rail-end（状态筛选 + 计数）本来就靠右（grid-area 1/2 + justify-self:end）
       的排布对齐 —— 收起态与展开态的控制区于是都贴在同一条右边线上。
       ⚠️ 占位必须放在**最前面**：flex 下它是唯一会吃掉剩余空间的元素，
       放在中间会把后面的元素也一起推走，看起来像"分成了两组"。 -->

    <span class="rail-sp" aria-hidden="true"></span>
    <button type="button" class="rail-t" id="railBtn" aria-expanded="false" aria-controls="railIn"
            data-i18n-attr="title:rail.tip">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
      <span data-i18n="rail.btn">搜索与筛选</span>
      <i class="ph ph-caret-down rail-cv" aria-hidden="true"></i>
    </button>
    <span class="rail-sum" id="railSum"></span>
    <button type="button" class="gb" id="clearBtn" hidden>
      <i class="ph ph-x" aria-hidden="true"></i><span data-i18n="rail.clear">清除筛选</span>
    </button>
  </div>
  <div class="rail-in wrap" id="railIn" hidden>
    <label class="q">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
      <input type="search" id="q" autocomplete="off" spellcheck="false"
             aria-label="搜索看板"
             data-i18n-attr="placeholder:search.ph,aria-label:attr.searchAria">
      <kbd class="kbd">Ctrl K</kbd>
    </label>
    <div class="chips" id="chips" role="group" aria-label="分组筛选" data-i18n-attr="aria-label:attr.chipsAria"></div>
    <div class="rail-end">
      <span class="seg" role="group" aria-label="状态筛选" data-i18n-attr="aria-label:attr.statusAria">
        <button type="button" class="seg-b" data-status="all" data-i18n="rail.all">全部</button>
        <button type="button" class="seg-b" data-status="online">Online</button>
        <button type="button" class="seg-b" data-status="beta">Beta</button>
      </span>
      <span class="count" id="count">—</span>
    </div>
  </div>
</div>

<main id="main" class="wrap">
  <section id="gate" hidden></section>

  <!-- ===================== L0 · 质量监控核心指标（v1 精简版） =====================
       v1 改：卡片只保留「名称 + 大数字 + 口径」，**不再显示等级徽章与严重度文字**。
       原版每张卡有「正常 / 关注 / 严重 / 不可用」四档徽章 + 阈值分档配色，
       一屏六张卡下来颜色通道互相打架，读的人要先分档再读数字。v1 取「尽量简要」，
       把等级那一路的信息整个摘掉，只留数字本身；颜色退回单一品牌色。
       数据口径、下钻、两档刷新节奏都没动 —— 改的只是呈现。 -->
  <section class="band" id="band" aria-label="Quality Control"></section>

  <!-- ===================== L0.5 · CXO 每日经营指标（v1 新增） =====================
       「CXO Daily Dashboard」里最常被追问的三个值，从那张看板里提出来平铺：
         · Total Traffic / Active Users / Valid Throughput of Video Download
       再加 2G / 3G / 4G 的**当月**可用率三张，凑成同样的一行六卡。
       一行六卡（与上面 QC 带同宽同节奏），窄屏按同一套断点折行。 -->
  <section class="band kpi" id="kpi" aria-label="CXO Daily Dashboard"></section>

  <!-- ===================== L0.6 · 六个视图入口（v1 新增） =====================
       CXO / SP / MS / FLM / FO / BO 六个视图各成一张卡，卡里列出该视图下
       几个代表性报告名，点报告名直接开对应看板（另一标签页）。
       这张卡是「目录的第二个入口」而不是替代品：下面原有的 L1 页签 / L2 辅助入口
       全部保留，所以随便用哪种方式都能到同一个看板。 -->
  <section class="band views6" id="views6" aria-label="View entries"></section>

  <!-- ===================== 地图 + 报告文件（v1 位置调整） =====================
       v1 改：地图与「报告文件」并排一行 —— 地图在左占大头，报告文件在右。

       ⚠️ 为什么报告文件会跑到这里：
       它原来是 L1 页签面板里的一个页签（与 MS/FLM/FO/BO 同一排）。
       本次按要求把整块 L1 页签面板去掉（上面六张入口卡已经覆盖那六个视图），
       但报告文件（内嵌 my_app 的 /myapp/?page=…）在上面六张卡里**没有对应入口**，
       跟着一起删就是功能丢失。所以把它单独摘出来，就近放到地图右边 ——
       两块都是「内嵌页」，并排一行在观感上也归为一类。

       ⚠️ 地图为什么单独一个 #l0Map 容器：
       它一度和 CXO/SP 焦点卡并排（.l0 的两栏），后来焦点卡整块去掉，
       地图就成了这一行里唯一的常驻块。renderL0 只写这个容器；
       报告文件由 renderEmailSection 写 #emailSlot，两者互不干涉。 -->
  <div class="maprow">
    <section class="map-slot" id="l0Map"></section>
    <!-- ⚠️ .panel 必须挂在这个容器**自己**身上，不能在它内部再套一层：
         renderEmailSection 是把 emailSectionHtml() 的结果（.p-head + .canvas 两段）
         直接写进 #emailSlot 的，内部没有 .panel 元素。
         原来它叫 #vEmail 时，.panel 是 viewsShell 搭骨架时写在 <section> 上的。 -->
    <section class="panel email-slot" id="emailSlot"></section>
  </div>

  <!-- 升级机制：v1 默认就展开，且只显示前 4 行（见 olbr.js 的 ESC_DEFAULT_ROWS）。
       v1 改：原来它被包在 .stage 里，与 CXO/SP 焦点区、L1 页签共用一个栅格
       （宽屏时「焦点区 | 页签」两栏、升级带整宽压在上一行）。
       那两块按要求去掉后 .stage 里只剩它一个，栅格没有存在的意义，
       于是拆掉 .stage 这一层，直接挂在 main 下 —— 少一层无谓嵌套。 -->
  <section class="esc" id="esc" aria-label="Escalation Matrix"></section>

  <!-- L2 · 辅助入口：去卡片化，无边框无色块，只留标题与行链接。
       v1 改：这里原来还有一张「本页相关 / About this page」的卡（两张行链接），
       按要求整块去掉 —— 那两条在顶栏已经各有一颗按钮（管理门户 / 统一门户），
       页脚还写着版本与安全合规状态，留在这里只是重复。
       现在 .aux 只渲染 T2 那三个分组（知识库 / 生态 / 系统运维）。 -->
  <section class="aux" id="aux" aria-label="Auxiliary"></section>

  <!-- L2 · 归档区（2026-09-28 加；2026-09-29 起**默认隐藏**）。
       与上面 .aux 分开一个容器，理由有二：
         ① 归档的语义与 T2「辅助入口」不同 —— 这些看板是**从各视图里移出来的**，
            放在同一块里会被读成"多了一个叫归档的业务分区"；
         ② T2 那块固定渲染三个分组、无条件存在，而归档**是例外状态**：
            9/29 起按用户要求默认整块 hidden，只有本会话真的归档过东西才露出来
            （开关是 olbr.js 的 state.sawArchive，理由与替代回执都在 renderArchive 里）。
       样式复用 .aux-g / .aux-h / .lrow（同一套行链接与折叠交互），
       只有 .arch-hint 一行说明是新加的 —— 它负责说清"这些看板没被删掉、怎么勾回来"，
       否则这个区块看起来像回收站。 -->
  <section class="aux arch" id="arch" aria-label="Archived" hidden></section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <!-- ⚠️ 2026-09-28（用户要求）：版权行由
           原「© 2026 ZTE Corporation · Liberia Office · Network Operation Center (OLR MS)」
           改为「© 2026 ZTE Corporation ·ZTE LIBERIA· INC」。
         用户给的写法里 `·ZTE LIBERIA·` 两侧没有空格（`·ZTE`、`LIBERIA·`），
         保留原样不改 —— 这是法律实体名，排版习惯不该由前端擅自"修正好看"。
         原来后半段走 i18n 的 foot.branch（zh 是「利比里亚办事处网络运营中心 (OLR MS)」），
         现在改成公司法律实体名，中英两种语言下都是同一串（不需要翻译），
         所以这里直接写死在 HTML，并把 foot.branch 从两份字典里一并删除 ——
         留着没人消费的键，下次翻译时会被误当成"漏翻的文案"再翻一遍。
         注：separator 用 `·` 时左右各留一个半角空格是原实现的视觉习惯，
         但用户点名要的字符串优先，故此处以用户给的写法为准。 -->
    <span>© 2026 ZTE Corporation ·ZTE LIBERIA· INC</span>
    <span class="foot-r">
      <span class="ok"><i class="ph ph-shield-check" aria-hidden="true"></i> <span data-i18n="foot.ok">安全合规模式运行</span></span>
      <span id="footSrc">—</span>
      <span class="ver" data-i18n="foot.ver">Ver 1.0-OLBR · 只读展示版</span>
    </span>
  </div>
</footer>

<!-- ===================== QC 下钻弹窗（统一下钻弹窗前 = 右侧抽屉） =============
     2026-09-23 改版：由「右侧滑入抽屉 .drawer + table.grid」换成与
     /MsPortal/ **逐类一致**的居中弹窗（.qc-mask / .qc-modal / …），
     样式来自两边共引的 /MsPortal/assets/qcDrill.css。

     为什么统一：两个门户的 QC 卡取自同一个接口（/api/portal-qc/detail，
     同样的 total/rows/columns），此前却是两种长相、两种能力 ——
     MsPortal 能排序 / 能导出 / 能跳完整看板，只读版都不能，
     同一个数字点开像是两个系统。

     为什么类名用 .qc-* 而不是复用本页的 .gp/.toast：
     那套是本页私有的浮层样式，.qc-* 是 qcDrill.css 的独立命名空间，
     两边同名同类，改一处两边同时生效。

     id 与 MsPortal 的 QcDrillModal **完全同名**：qcMask / qcTitle / qcSearch /
     qcReload / qcExport / qcOpenBoard / qcThead / qcTbody / qcCount / qcPage /
     qcPrev / qcNext / qcClose —— 两份 index.html 可以直接对着 diff。
     ======================================================================== -->
<div class="qc-mask" id="qcMask" hidden>
  <div class="qc-modal" role="dialog" aria-modal="true" aria-labelledby="qcTitle">
    <div class="qc-head">
      <!-- 拖动抓手：标题栏整体可拖（cursor:move），这条纹理让「能拖」一眼可见。
           仅装饰，不参与任何事件逻辑，故 aria-hidden。与 MsPortal 同款。 -->
      <span class="qc-grip" aria-hidden="true"></span>
      <h3 id="qcTitle">Quality Control</h3>
      <button type="button" class="qc-x" id="qcClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="qc-body">
      <div class="qc-tools">
        <input type="search" id="qcSearch" autocomplete="off"
               data-i18n-attr="aria-label:attr.drQAria,placeholder:dr.qPh">
        <button type="button" class="qc-btn" id="qcReload" data-i18n="dr.reload">刷新</button>
        <!-- 导出：与 MsPortal 同一套 UNIFIED_EXCEL_V1（/MsPortal/assets/excelReport.js）。
             只读版原本没有导出，是这次统一补齐的能力之一。 -->
        <button type="button" class="qc-btn" id="qcExport" data-i18n="dr.export">导出 Excel</button>
        <!-- 跳到 my_app 里对应的完整看板继续处理。只给确实存在对应看板的维度：
             alarm/tt/wo/spms 加 2026-09-26 补上的 cr/pmt 共六项，正好与面板上
             六张卡一一对应（映射见 olbr.js 的 QC_BOARD_PAGE）。
             href 与显隐由 olbr.js 的 applyDrillTitle 设置 ——
             这里不写死 href，换 my_app 路径时不用改 HTML。 -->
        <a class="qc-btn" id="qcOpenBoard" hidden target="_blank" rel="noopener"
           data-i18n="dr.openBoard">打开完整看板</a>
      </div>
      <div class="qc-scroll" id="qcScroll">
        <table class="qc-table">
          <thead id="qcThead"></thead>
          <tbody id="qcTbody"></tbody>
        </table>
      </div>
      <div class="qc-hint" data-i18n="dr.filterHint"></div>
    </div>
    <div class="qc-foot">
      <div class="qc-foot-in">
        <span class="qc-note" id="qcCount"></span>
        <span class="qc-pager">
          <button type="button" class="qc-btn" id="qcPrev">‹</button>
          <span class="qc-page" id="qcPage"></span>
          <button type="button" class="qc-btn" id="qcNext">›</button>
        </span>
      </div>
    </div>
  </div>
</div>

<!-- 编辑态的「分组归属」浮层：内容随点开的卡片生成（fixed 定位贴在卡片旁边，
     不用 modal —— 改归属时还得看见卡片本身，遮罩会把上下文全挡住） -->
<div class="gp" id="grpPop" hidden></div>

<!-- 编辑态的「改名」浮层：一级分组改名 / 新增分组 / 看板改标题共用这一颗（同一时刻只开一个） -->
<div class="gp gp--form" id="editPop" hidden></div>

<!-- ===================== 用户管理弹窗（2026-09-22 加） =====================
     与 http://localhost/uniplam/ 的 UserManagementModal、/MsPortal/ 的移植版是
     **同一个用户库的第三个操作界面**：骨架只放静态壳子与固定按钮，表体 / 表单 /
     页面配置面板全部由 olbr.js 的 renderUserMgmt() 按 state.um 整块重画
     （输入到一半的值先落 state 再画，否则重绘会清掉用户正在敲的内容）。
     样式在 olbr.css 的 .um-* 段，走本页令牌，不引 MsPortal 的 portal.css。 -->
<div class="um-mask" id="umMask" hidden>
  <div class="um-modal" role="dialog" aria-modal="true" aria-labelledby="umTitle">
    <div class="um-head">
      <div class="um-head-txt">
        <h3 id="umTitle" data-i18n="um.title">用户管理</h3>
        <p class="um-sub" data-i18n="um.subtitle">统一门户账号的增删与权限设置（仅管理员可见，与 /uniplam/ 同库同步）</p>
      </div>
      <span class="um-head-actions">
        <button type="button" class="gb" id="umReload" data-i18n="um.reload">刷新</button>
        <a class="gb" id="umOpenPortal" href="/uniplam/" target="_blank" rel="noopener noreferrer"
           data-i18n="um.openPortal">在统一门户打开</a>
        <button type="button" class="ib" id="umClose" aria-label="Close">
          <i class="ph ph-x" aria-hidden="true"></i>
        </button>
      </span>
    </div>
    <div class="um-body" id="umBody"></div>
    <!-- 底部固定操作栏：放在滚动区之外，页面配置面板展开时「保存」常驻可见 -->
    <div class="um-foot" id="umFoot" hidden>
      <span class="um-foot-who" id="umFootWho"></span>
      <span class="um-foot-actions">
        <button type="button" class="gb" id="umCancelBtn" data-i18n="um.pagesCancel">收起</button>
        <button type="button" class="gb um-primary" id="umSaveBtn" data-i18n="um.pagesSave">保存页面配置</button>
      </span>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/MsPortal/assets/data.js"></script>
<script src="/MsPortal/assets/terms.js"></script>
<script src="/MsPortal/assets/access.js"></script>
<!-- 下钻弹窗的「导出 Excel」（2026-09-23 加）。与 MsPortal 用的是同一个文件、
     同一套格式 UNIFIED_EXCEL_V1 → 两个门户导出的表头 / 底纹 / 冻结行完全同款。

     刻意**不**在这里引 vendor/exceljs.min.js（约 0.9MB）：excelReport.js 内部会按
     自身脚本地址推出 assets/ 基址，点「导出」时才 loadExcelJS() 注入同目录的
     vendor/exceljs.min.js —— 本页以 /MsPortal/assets/excelReport.js 的绝对路径加载，
     所以那个相对推导结果是 /MsPortal/assets/vendor/… 命中同一个文件。
     多引一行只会让只读版首屏白白多下 0.9MB。 -->
<script src="/MsPortal/assets/excelReport.js"></script>
<!-- QC 下钻弹窗的拖动 / 点击位置定位（2026-09-23 加）。与 /MsPortal/ 共用同一个
     文件，行为逐条对齐 /myapp/ 的 DraggableClickModal：以点击位置为中心弹出、
     按住标题栏可拖、点遮罩不关闭。 -->
<script src="/MsPortal/assets/qcDrill.drag.js"></script>
<!-- 纯数据母本（i18n 字典 / 图标 / layout 常量 / QC 阈值 / KPI 规格），
     2026-09-25 从 olbr.js 拆出。必须排在 olbr.js **之前**：主文件 boot 时
     直接读 window.OLBR_DATA，顺序反了会拿到空对象、整页文案变裸 key。 -->
<script src="assets/olbr-data.js"></script>
<script src="assets/olbr.js"></script>
</body>
