<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLR MS Management Platform — Workspace</title>
<meta name="description" content="ZTE OLR MS Management Platform workspace — one page to see the current state, reach every business view, and pick up what needs action.">
<link rel="icon" type="image/png" sizes="16x16" href="/MsPortal/assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/MsPortal/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/MsPortal/assets/favicon-180.png">
<!-- 图标字体与品牌资产都从 /MsPortal/ 只读引用（同一份 Phosphor 子集、同一个 Z 标），
     本页面不写、不改对方目录下任何文件。 -->
<link rel="stylesheet" href="/MsPortal/assets/icons/phosphor.css">
<link rel="stylesheet" href="assets/olr.css">
<script>
/* 首屏防闪烁：主题与语言在 CSS 生效前就落到 &lt;html&gt; 上。
   键名独立（olrportal.*），与 /MsPortal/ 的 msportal.* 互不读写 ——
   两个页面各记各的偏好，在这里切深色不会影响那边。 */
(function () {
  try {
    if (localStorage.getItem('olrportal.theme.v1') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    if (localStorage.getItem('olrportal.lang.v1') === 'en') {
      document.documentElement.setAttribute('lang', 'en');
    }
  } catch (e) { /* 隐私模式下 localStorage 会抛，忽略即可 */ }
})();
</script>
</head>
<body>

<!-- ======================================================== 顶栏 ========= -->
<!-- 两行：品牌行 + 检索行。环境名、时钟不占顶栏 —— 它们属于数据新鲜度，
     已下移到 Quality Control 右侧那一行。 -->
<header class="olr-mast">
  <div class="olr-mast-inner">
    <div class="olr-mast-brand">
      <a class="olr-brand" href="/olrportal/" aria-label="OLR MS Management Platform home">
        <img class="olr-brand-mark" src="/MsPortal/assets/logo-zte-z-116.png"
             srcset="/MsPortal/assets/logo-zte-z-116.png 2x, /MsPortal/assets/logo-zte-z-174.png 3x"
             alt="ZTE" decoding="async">
        <span class="olr-brand-zte">ZTE</span>
        <span class="olr-brand-sep" aria-hidden="true"></span>
        <span class="olr-brand-title"><span class="olr-brand-olr">OLR</span> MS Management Platform</span>
      </a>
      <p class="olr-brand-sub" data-i18n="brand.sub">运营工作台 · Operations Workspace</p>
    </div>

    <div class="olr-mast-tools">
      <div class="olr-seg" role="group" aria-label="Language">
        <button type="button" class="olr-seg-btn" data-lang="zh">中文</button>
        <button type="button" class="olr-seg-btn" data-lang="en">EN</button>
      </div>
      <button type="button" class="olr-icon-btn" id="themeBtn" data-i18n-attr="title:theme.tip" title="深色 / 浅色">
        <i class="ph ph-moon" aria-hidden="true"></i>
      </button>
      <div class="olr-user" id="userMenu">
        <button type="button" class="olr-user-btn" id="userBtn" aria-haspopup="true" aria-expanded="false" aria-controls="userMenuList">
          <span class="olr-user-avatar" aria-hidden="true"><i class="ph ph-user"></i></span>
          <span class="olr-user-name" id="userName">—</span>
          <i class="ph ph-caret-down olr-user-caret" aria-hidden="true"></i>
        </button>
        <div class="olr-user-list" id="userMenuList" hidden role="menu"></div>
      </div>
    </div>
  </div>

  <div class="olr-mast-search">
    <label class="olr-search">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
      <input type="search" id="q" autocomplete="off" spellcheck="false"
             data-i18n-attr="placeholder:search.ph" placeholder="搜索看板、报表、站点…">
      <button type="button" class="olr-search-clear" id="qClear" hidden aria-label="Clear">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </label>
    <nav class="olr-jump" id="jump" aria-label="Business domains"></nav>
    <span class="olr-count" id="count"></span>
  </div>
</header>
<!-- ==================================================== /顶栏 ============= -->

<!-- ============================================ Quality Control 状态条 === -->
<!-- 高度锁定在 ~100px：KPI 在这里是**信息**，不是主视觉。点击任一数字下钻明细。 -->
<section class="olr-qc" id="qc" aria-label="Quality Control"></section>

<!-- ======================================================== 主体 ========= -->
<main class="olr-main">
  <div class="olr-ops">
    <div class="olr-ops-head">
      <h2 class="eyebrow" data-i18n="ops.title">Operations</h2>
      <p class="olr-ops-note" data-i18n="ops.note">按业务域进入 · 每个域下面是它自己的看板清单</p>
    </div>
    <div id="domains"></div>
    <p class="olr-empty" id="noMatch" hidden></p>
  </div>

  <aside class="olr-side">
    <div class="olr-side-inner">
      <section class="olr-panel" id="net" aria-label="Network overview"></section>
      <section class="olr-panel" id="work" aria-label="My work"></section>
      <section class="olr-panel" id="recent" aria-label="Recently opened"></section>
    </div>
  </aside>
</main>

<!-- ==================================== 次级入口（决策层 / 系统 / 资料） == -->
<section class="olr-more" id="more" aria-label="Supporting entries"></section>

<footer class="olr-foot">
  <span>© 2026 ZTE Corporation · <span data-i18n="foot.branch">利比里亚办事处网络运营中心 (OLR MS)</span></span>
  <span class="olr-foot-right">
    <span data-i18n="foot.source">目录来源：统一看板目录（与 /MsPortal/ 同一份）</span>
    <span class="mono">Ver 1.0.0-LR</span>
  </span>
</footer>

<!-- ======================================================== 弹窗 ========= -->
<div class="olr-mask" id="qcMask" hidden>
  <div class="olr-modal" role="dialog" aria-modal="true" aria-labelledby="qcTitle">
    <div class="olr-modal-head">
      <h3 id="qcTitle">Quality Control</h3>
      <button type="button" class="olr-icon-btn sm" id="qcClose" aria-label="Close"><i class="ph ph-x"></i></button>
    </div>
    <div class="olr-modal-tools">
      <input type="search" id="qcSearch" autocomplete="off">
      <button type="button" class="olr-btn" id="qcReload" data-i18n="btn.reload">刷新</button>
    </div>
    <div class="olr-modal-scroll" id="qcScroll">
      <table class="olr-table"><thead id="qcThead"></thead><tbody id="qcTbody"></tbody></table>
    </div>
    <div class="olr-modal-foot">
      <span class="mut" id="qcCount"></span>
      <span class="olr-pager">
        <button type="button" class="olr-btn" id="qcPrev">‹</button>
        <span class="mono" id="qcPage"></span>
        <button type="button" class="olr-btn" id="qcNext">›</button>
      </span>
    </div>
  </div>
</div>

<div class="olr-mask" id="escMask" hidden>
  <div class="olr-modal wide" role="dialog" aria-modal="true" aria-labelledby="escTitle">
    <div class="olr-modal-head">
      <h3 id="escTitle" data-i18n="esc.title">升级机制 (Escalation Matrix)</h3>
      <button type="button" class="olr-icon-btn sm" id="escClose" aria-label="Close"><i class="ph ph-x"></i></button>
    </div>
    <div class="olr-modal-scroll" id="escBody"></div>
  </div>
</div>

<div class="olr-mask" id="loginMask" hidden>
  <div class="olr-modal sm" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="olr-modal-head">
      <h3 id="loginTitle" data-i18n="login.title">登录统一门户</h3>
      <button type="button" class="olr-icon-btn sm" id="loginClose" aria-label="Close"><i class="ph ph-x"></i></button>
    </div>
    <form class="olr-login" id="loginForm">
      <label><span data-i18n="login.user">用户名</span><input id="loginUser" type="text" autocomplete="username" required></label>
      <label><span data-i18n="login.pass">密码</span><input id="loginPass" type="password" autocomplete="current-password" required></label>
      <p class="olr-err" id="loginErr" hidden></p>
      <p class="mut" data-i18n="login.note">使用统一门户同一套账号、密码和权限。</p>
      <div class="olr-modal-foot">
        <button type="button" class="olr-btn" id="loginCancel" data-i18n="login.cancel">取消</button>
        <button type="submit" class="olr-btn primary" id="loginSubmit" data-i18n="login.submit">登录</button>
      </div>
    </form>
  </div>
</div>

<div class="olr-toast" id="toast" hidden></div>

<!-- 看板目录（51 个看板 + QC 指标定义 + 升级机制表）与服务端目录、权限判定
     都直接复用 /MsPortal/ 的那一份：这里只读引用，不复制、不改动，
     所以在 MsPortal 里改过目录，刷新本页就是最新的。 -->
<script src="/MsPortal/assets/data.js"></script>
<script src="/MsPortal/assets/access.js"></script>
<script src="assets/olr.js"></script>
</body>
</html>
