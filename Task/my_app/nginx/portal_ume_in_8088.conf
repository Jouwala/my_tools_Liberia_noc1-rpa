# =============================================================================
# 8088 UME iMonitor 大屏（guard-imonitor-iui）反代
#   上游：https://172.17.208.1:28808   （em-portal 登录 + /iui/guard-imonitor-iui 大屏）
# 本文件是仓库内的版本留档；**实际生效**的是 nginx 安装目录里的
#   Y:\01_RPA\nginx-1.28.0\conf\portal_ports.conf
# 修改后需 `nginx -t && nginx -s reload` 才生效。
#
# ⚠️ 2026-11-09：8088 必须说 TLS。主站 80 已强制 301 到 443，前端 iframe 指向
#    https://<host>:8088/...（ImonitorScreen.tsx 的 portalBase 固定 https）；
#    端口若仍是明文 HTTP，TLS 握手收到明文 -> Chrome ERR_SSL_PROTOCOL_ERROR
#    （错误页文案「localhost sent an invalid response」），大屏整块空白。
#    也不能改回 http:// —— https 页面嵌 http iframe 会被混合内容拦下。
#    生效配置 conf/portal_ports.conf 已把 8081-8088 统一改成 `listen ... ssl`
#    并复用 443 的自签证书；proxy_redirect 的目标也必须是 https://$host:8088/。
#
# 端口选择：8087 已被 ShadowBot.Shell（RPA 工具）占用（127.0.0.1:8087），
#           且它绑在回环上，会让 localhost:8087 落到它而不是 nginx —— 故用 8088。
#
# 与其它门户反代（portal_ports.conf 的 8081~8086）同构，差异只有两点，都是实测必需：
#   1) 上游自带 `Content-Security-Policy: frame-ancestors 'self'`，会把 iframe 嵌
#      入直接拦死（Chromium 报 "Framing ... violates ... frame-ancestors 'self'"）。
#      因此必须摘掉 CSP（连同 X-Frame-Options / HSTS），否则大屏在 myapp 里永远是
#      一片空白 + chrome-error 页。
#   2) 登录页内联了 frame-bust：
#          if (self === top) { } else { top.location = self.location; }
#      大屏 SPA 在无会话时会**自己**跳到这个登录页（实测：401 → #/no-access →
#      /api/oauth2/v1/authorize?redirect_uri=/iui/guard-imonitor-iui/）。若登录页
#      嵌在 myapp 的 iframe 里，这段脚本会把**整个 myapp 标签页**导航到登录页，
#      把 myapp 外壳冲掉。这里用 sub_filter 把它改成 no-op，登录全过程留在 iframe 内。
#      ⚠️ 门户 JS 里还有两处同类动作（login.min.js 的 `top!=self&&(top.location=self.location)`、
#      security.min.js 登录成功后 `redirectToUrl(top.location, home)`），**改 HTML 挡不住**，
#      故前端 iframe 另加了 sandbox（不含 allow-top-navigation）从浏览器层封死 ——
#      见 frontend/src/pages/ImonitorScreen.tsx 的 sandbox 注释。两处都需要，别只留一处。
#   3) 语言（2026-11-10）：上游 scripts.*.js::getLanguage() 先读同源
#      localStorage["language-option"]（JSON 字符串 zh-CN / en-US），读不到才用
#      navigator.language；中文 Windows 上大屏时钟输出「2026年11月10日」，
#      与门户 ?lang=en 无关（那是 MsPortal 自己的参数，传不进跨源 iframe）。
#      故在 </head> 注入一段同步脚本，按 iframe URL 的 ?lang= 写该键；
#      ImonitorScreen.tsx 负责把 my_app 的 locale 拼进 8088 URL，
#      MsPortal/assets/viewer.js::embedSrc() 负责把门户语言带给 /myapp/。
#      URL 没带 lang 时不写，保留用户在上游自选的语言。
# =============================================================================

server {
    listen       8088 ssl;
    listen       [::]:8088 ssl;
    server_name  _;

    # 与 443 共用同一张自签证书（SAN 含 .20/.19/localhost/127.0.0.1）。
    # 实际生效的 conf/portal_ports.conf 把这几行放在 http{} 级，所有 808x 共用；
    # 本文件是独立留档片段，故显式写全，合并时按 portal_ports.conf 的口径去重。
    ssl_certificate     D:/01_RPA/nginx-1.28.0/certs/portal.crt;
    ssl_certificate_key D:/01_RPA/nginx-1.28.0/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 自动填表脚本（与登录页同源，凭据随请求下发 no-store，不落盘）
    location = /api/portals/inject.js {
        proxy_pass http://127.0.0.1:7038;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass          https://172.17.208.1:28808;
        proxy_ssl_verify    off;
        proxy_ssl_server_name on;
        proxy_http_version  1.1;
        proxy_set_header Host              172.17.208.1:28808;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # 门户有跨站防护（带会话但 Origin/Referer 不匹配时 403），置空避免误判
        proxy_set_header Origin            "";
        # 必须关掉上游压缩，否则 sub_filter 看不到明文 HTML
        proxy_set_header Accept-Encoding   "";
        proxy_cookie_domain 172.17.208.1 $host;
        proxy_cookie_flags  ~ nosecure samesite=lax;
        proxy_redirect      https://172.17.208.1:28808/ https://$host:8088/;
        # 摘掉会阻止 iframe 嵌入 / 破坏 myapp 的响应头（见文件头说明）
        proxy_hide_header   Strict-Transport-Security;
        proxy_hide_header   Content-Security-Policy;
        proxy_hide_header   X-Frame-Options;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        sub_filter_once off;
        # ① 中和登录页 frame-bust：让登录页老老实实待在 iframe 里
        sub_filter 'top.location = self.location;' '/* myapp: frame-bust disabled */';
        # ② 自动填表（填账号密码 + 点登录按钮）+ ③ 按 ?lang= 写上游语言键
        #    ⚠️ 注入的是 head 内的同步脚本，必须早于 body 末尾的 defer bundle；
        #       改这里要同步改生效配置 conf/portal_ports.conf 的 8088 server 块。
        sub_filter '</head>' '<script src="/api/portals/inject.js?system=ume_in"></script><script>(function(){try{var l=new URLSearchParams(location.search).get("lang");if(l==="en"||l==="zh"){localStorage.setItem("language-option",JSON.stringify(l==="en"?"en-US":"zh-CN"));}}catch(e){}})();</script></head>';
    }
}
