# ZTE UME 客户端本机登录反代
# 让访问 https://<myapp-host>:8081 的浏览器保持自己的 Cookie/localStorage，
# 保留 UME 原生 URL 路径，避免 CSRF token 因路径前缀变化而失效。
# 本片段需合并到实际运行的 nginx 配置；不要再套 /portal/zte_ume/ 前缀。
#
# ⚠️ 2026-11-09：8081 必须说 TLS。主站 80 已强制 301 到 443，前端的
#    `//{HOST}:8081`（PROXY_PREFIXES -> PortalLogin.tsx）在 https 页面上会解析成
#    https://<host>:8081；明文端口会回 ERR_SSL_PROTOCOL_ERROR。生效配置见
#    conf/portal_ports.conf（8081-8088 统一 `listen ... ssl` + 共用 443 证书）。

server {
    listen 8081 ssl;
    listen [::]:8081 ssl;
    server_name _;

    ssl_certificate     D:/01_RPA/nginx-1.28.0/certs/portal.crt;
    ssl_certificate_key D:/01_RPA/nginx-1.28.0/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass https://10.100.28.27:28001;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        proxy_set_header Host 10.100.28.27:28001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # UME 会拒绝来自 192.168.100.20:8081 的浏览器 Origin/Referer（3329008）。
        # 由反代清除这两个跨站来源头；登录 Cookie/CSRF 状态仍保留在访问者浏览器。
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        proxy_redirect https://10.100.28.27:28001/ /;
        proxy_redirect http://10.100.28.27:28001/ /;
        proxy_cookie_domain 10.100.28.27 $host;
        proxy_cookie_path / /;

        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;

        # 让访问者自己的浏览器自动加载 my_app 的填表脚本。
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        # text/html 是 sub_filter_types 的默认值，写出来只会报 duplicate MIME type
        # （2026-11-09 与生效配置同步）；这里只过滤 HTML，无需声明。
        # 与登录页同源，用相对路径；写死 http:// 会在 TLS 端口上造成混合内容拦截
        sub_filter '</head>' '<script src="/api/portals/inject.js?system=zte_ume"></script></head>';
    }
}
