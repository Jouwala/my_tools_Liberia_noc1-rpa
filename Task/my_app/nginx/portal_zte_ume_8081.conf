# ZTE UME 客户端本机登录反代
# 让访问 http://<myapp-host>:8081 的浏览器保持自己的 Cookie/localStorage，
# 保留 UME 原生 URL 路径，避免 CSRF token 因路径前缀变化而失效。
# 本片段需合并到实际运行的 nginx 配置；不要再套 /portal/zte_ume/ 前缀。

server {
    listen 8081;
    server_name _;

    location / {
        proxy_pass https://10.100.28.27:28001;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        proxy_set_header Host 10.100.28.27:28001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Origin https://10.100.28.27:28001;
        proxy_set_header Referer https://10.100.28.27:28001$request_uri;

        proxy_redirect https://10.100.28.27:28001/ /;
        proxy_redirect http://10.100.28.27:28001/ /;
        proxy_cookie_domain 10.100.28.27 $host;
        proxy_cookie_path / /;

        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;

        # 让访问者自己的浏览器自动加载 my_app 的填表脚本。
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</head>' '<script src="http://$host:8081/api/portals/inject.js?system=zte_ume"></script></head>';
    }
}
