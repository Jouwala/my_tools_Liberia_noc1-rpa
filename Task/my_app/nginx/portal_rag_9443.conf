# =============================================================================
# 9443 RAG 知识问答（Open WebUI）反代 —— 2026-10-24
#   上游：https://192.168.100.27      （= .27 的 443，**NOC 身份入口，自动登录**）
#   前端访问：https://192.168.100.20:9443/
#
# 本文件是仓库内的版本留档；**实际生效**的是 nginx 安装目录里的
#   D:\01_RPA\nginx-1.28.0\conf\portal_ports.conf  末尾同名 server 块
#   （2026-10-01 起本机 nginx 跑在本地 D 盘，不再用 Y: 网络盘，见根 AGENTS.md 四.6b）
# 修改后需先 `nginx -t` 再 `cd D:\01_RPA\nginx-1.28.0; .\nginx.exe -s reload`。
#
# -----------------------------------------------------------------------------
# 为什么需要这一跳（问题不是技术故障，是 VPN 端口白名单）
# -----------------------------------------------------------------------------
# 同事登录 VPN 后访问 https://192.168.100.27:8443/ 稳定超时
# （ERR_CONNECTION_TIMED_OUT）；不登 VPN、或访问 192.168.100.20 则正常。
# 排查已排除：服务故障（curl -k 200/18ms）、三层不通（ping 0 丢包）、
# 证书链不完整（.27 已补 fullchain 为 2 张）、吊销检查（软失败不产生超时）、
# 浏览器缓存（无痕仍复现）。结论：8443 不在 VPN/防火墙放行名单。
# 而 .20 在名单内、且与 .27 同网段直连可达 → 在 .20 上开端口借道。
#
# 端口选择：9443。8081-8088 已被各网管门户占用；9443 实测空闲，且与 443 同为
#   https，便于同事记忆。**不要改用 9543/9643 之类的"下一个端口"** —— 若 9443
#   将来也被策略收紧，正确做法是去申请把 192.168.100.27:8443 加白名单，而不是
#   继续换端口（否则只是把同一个问题推后）。
#
# 为什么不用子路径（如 /rag/）：Open WebUI **不支持子路径部署**，实测白屏；
#   它没有 WEBUI_URL 式的 base path 配置项。这是本项目多处"独立端口反代"
#   架构的由来（见 portal_ports.conf 头部）。
#
# -----------------------------------------------------------------------------
# 与 8081-8088 网管门户反代的差异（**照抄会坏**，共 3 处）
# -----------------------------------------------------------------------------
#   1) 必须摘 Alt-Svc。
#      上游 Caddy 下发 `Alt-Svc: h3=":443"`。浏览器学到 QUIC 直连后，后续请求会
#      **绕过本反代直连 .27**，反代立即失效 —— 且失败表现仍是"超时"，极难归因。
#      网管门户没有这条，是因为它们的上游不发 Alt-Svc。
#   2) Host 必须是上游地址（192.168.100.27），不是 $host。
#      Open WebUI 用 Host 生成绝对跳转；若为 192.168.100.20:9443，登录后可能被
#      导到反代之外的地址。
#   3) proxy_buffering off。
#      Open WebUI 逐 token 流式输出，不关缓冲会"攒齐才吐"，表现为回答长时间空白
#      后一次性出现。
#
# -----------------------------------------------------------------------------
# Cookie 为什么不需要 proxy_cookie_domain 也能工作
# -----------------------------------------------------------------------------
# 上游 Cookie 形如 `token=...; Path=/; SameSite=lax`，**没有 Domain 属性**
# （host-only）。浏览器按**当前访问 host**（192.168.100.20）存储，行为天然正确。
# `proxy_cookie_domain` 只在上游**有** domain 时才改写；此处保留该行是防御上游
# 将来改成带 domain，写了无副作用（2026-10-24 实测未触发）。
#
# -----------------------------------------------------------------------------
# ⚠️ 安全约束（必读，防止后人误改）
# -----------------------------------------------------------------------------
# 上游 /api/config 返回 "auth_trusted_header": true，即 Open WebUI 认
# X-Forwarded-Email / X-Forwarded-User 之类的**信任头**。
#   本反代**刻意不设置任何信任头**，只设 X-Real-IP / X-Forwarded-For /
#   X-Forwarded-Proto。
#   **任何人若在此 location 内加 trusted header 做"免登录"，等于把 .20:9443
#   变成未认证入口**，切勿。
#
# 注意：9443 → .27:443 = NOC 入口，Caddy 会照常注入 NOC 身份头。即**任何能访问
#   .20:9443 的人都以 NOC 身份自动登录 Open WebUI（无需密码）**。这是既定设计
#   （门户看板描述为"全员可用"），不是缺陷；若将来收紧，应在此处加来源限制，
#   而不是去掉反代。
#
# -----------------------------------------------------------------------------
# 验证记录（2026-10-24）
# -----------------------------------------------------------------------------
#   · 本机 https://192.168.100.20:9443/ → 200，32ms，11601 字节，
#     与直连 .27 的 Etag 一致（94fe10f7...）。
#   · WebSocket /ws/socket.io/ → 101（聊天流式必需）。
#   · 响应头无 Alt-Svc，Via: 1.1 Caddy 证明穿透成功；80/443 未受影响。
#   · 同事端在**登录 VPN 状态下**实测可访问。
#
# 回滚：删掉 portal_ports.conf 末尾的 9443 server 块后 reload。
#   备份：portal_ports.conf.bak_20261024_加RAG反代前（本机 conf 目录，不入库）。
#   前端配套：v3/olbrportal/assets/olbr.js 的 qaSrc 归一逻辑、
#   MsPortal/assets/data.js、MsPortal/assets/access.js 三处需一并改回。
# 设计决策全文见：liberia-noc_soc-数据看板统一门户/docs/architecture.md 九之十三
# =============================================================================

server {
    listen       9443 ssl;
    listen       [::]:9443 ssl;
    server_name  _;

    ssl_certificate     D:/01_RPA/nginx-1.28.0/certs/portal.crt;
    ssl_certificate_key D:/01_RPA/nginx-1.28.0/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Open WebUI 上传知识库文档可能较大，默认 1m 会 413
    client_max_body_size 1024m;

    location / {
        proxy_pass             https://192.168.100.27;
        proxy_ssl_verify       off;
        proxy_ssl_server_name  on;
        proxy_http_version     1.1;

        # 差异点 2：Host 必须是上游地址，不是 $host（见文件头说明）
        proxy_set_header Host             192.168.100.27;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # ⚠️ 不要在此加 X-Forwarded-Email / X-Forwarded-User 等信任头，见文件头安全约束

        # WebSocket（Enable_websocket: true，聊天流式必需）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 上游 Cookie 是 host-only，本行是防御性保留（见文件头说明）
        proxy_cookie_domain  192.168.100.27 $host;
        proxy_cookie_flags   ~ nosecure;

        # 差异点 1：摘 Alt-Svc，防止浏览器 QUIC 直连 .27 绕过本反代
        proxy_hide_header    Alt-Svc;

        # 差异点 3：流式输出必须关缓冲
        proxy_buffering      off;
        proxy_cache          off;

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;
    }
}
