# Alembic config (architecture optimization Phase 2, 2026-08-06)
# Target DB: db/app.db (SQLite). The real URL is computed to an absolute
# path in alembic/env.py; sqlalchemy.url here is only a placeholder.
# NOTE: keep this file ASCII-only, alembic reads it with locale encoding.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///db/app.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
