<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./legacy-glass-baseline.css">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CXO Daily Dashboard</title>
<script src="/myapp/lib/echarts.min.js"></script>
<script src="/myapp/myapp-refresh-protocol.js"></script>
<style>
:root{--bg:#02050c;--panel:#071027;--blue:#258cff;--cyan:#00d9ff;--text:#f5f7ff;--muted:#aebbd4;--edge:#174bba;--glow:rgba(58,118,255,.48)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}
.screen{min-height:100vh;background:radial-gradient(circle at 50% 8%,rgba(0,127,255,.14),transparent 24%),#02050c;padding:0 6px 10px}
.mast{height:66px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#080f43 0,#070d31 73%,transparent 74%);border-top:1px solid #aab3c5}
.mast:after{content:"";position:absolute;left:0;right:0;bottom:6px;height:4px;background:linear-gradient(90deg,#1a35ae 0 13%,#1da7ff 15% 41%,transparent 44% 58%,#03dcef 60% 85%,#3545b4 87%)}
/* ===== 顶栏四元素配色统一到 .viewbtn 同源青色 =====
   2026-10-20 modern glass 化迭代目标：
   浅色与深色主题左上角 .logo、中部 h1、右上角 .viewbtn、右下角 .sub
   四处颜色统一到与顶部彩色横条 .mast:after 同色系的青色家族。
   - 左上角 .logo：在原白底金 V 之外，浅色态给 MAX 字套品牌青 #0e7490；
     深色态保留白 #fff + 金 #ffdc00（夜光视觉下不破坏发光层次）。
   - 中部 h1：浅色态 #0e7490；深色态保留原 #65dcff + text-shadow #1da7ff。
   - 右上 .viewbtn：保持深色态 cyan glow (rgba(0,203,255,.25)) 不变，作为「探照光」基准。
   - 右下 .sub：浅色态 #0e7490 + opacity:.78；深色态保留原 #7fd2ee。 */
.logo{position:absolute;left:10px;top:12px;font-size:27px;font-weight:1000;font-style:italic;letter-spacing:-5px;color:#fff}
.logo b{color:#ffdc00}
.mast h1{font-size:16px;color:#65dcff;text-shadow:0 0 18px #1da7ff;margin:0}
.mast .sub{position:absolute;left:96px;top:26px;font-size:11px;color:#7fd2ee}
.viewbtn{position:absolute;right:14px;top:17px;z-index:3;padding:8px 14px;border:1px solid #16bfe3;border-radius:4px;background:#092348;color:#8cecff;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;box-shadow:0 0 12px rgba(0,203,255,.25)}
.viewbtn:hover{background:#0d3868}
.asof{position:absolute;right:14px;top:49px;z-index:3;font-size:10px;color:#8cecff;background:rgba(9,35,72,.75);border:1px solid #17499c;border-radius:12px;padding:2px 10px}
/* 数据完整性提示：仅在存在缺口日时显示，位置在「数据截至」下方 */
.cover-chip{position:absolute;right:14px;top:72px;z-index:3;font-size:10px;border-radius:12px;padding:2px 10px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover-chip.warn{border:1px solid #8a6d10;color:#f6cf00;background:rgba(74,60,8,.7)}
/* ---- 工具栏：粒度 / 对比窗口 ---- */
.bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:9px 8px 2px}
/* 粒度开关（Day/Week/Month）的观感统一交给共享基线的 .wht —— 它与外壳
   MsSlaDashboard.tsx:760 的 .wh-seg .wh-gran-switch 本来就是同一个控件。
   原先这里自写一套：外框 #17499c + 选中 #0d3868/内描边 #21d5ec，浅色档换成 #d9f0f7。
   #granSeg 与 button.active 由 :820 的 JS 切换，类名保留不动。 */
/* .lbl 原本只在 .bar 里用；粒度标签跟着开关挪进了区块标题行，
   所以选择器放开到 .lbl，两处共用同一档弱化文字。 */
.lbl{font-size:11px;color:#7fd2ee}
/* ---- 卡片 ---- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 4px 0}
.cards.trio{grid-template-columns:repeat(3,1fr);padding-top:2px}
.card{position:relative;background:linear-gradient(180deg,#08122c,#050d22);border:1px solid #153db0;border-radius:10px;box-shadow:inset 0 7px 17px var(--glow);padding:10px 12px 8px;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#1da7ff,#00d9ff)}
.card.sm:before{background:linear-gradient(180deg,#3545b4,#1da7ff)}
.card .ttl{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.card .ttl b{font-size:12.5px;color:#cfe6ff;font-weight:700;letter-spacing:.2px}
.card .ttl i{font-style:normal;font-size:10px;color:#7fd2ee}
.card .val{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.card .val span{font-size:30px;font-weight:800;color:#fff;text-shadow:0 0 16px rgba(29,167,255,.45);font-variant-numeric:tabular-nums;line-height:1.05}
.card.sm .val span{font-size:23px}
.card .val em{font-style:normal;font-size:11px;color:#8cecff}
.card .when{font-size:10px;color:#6f8cb4;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:10px;border-radius:11px;padding:2px 8px;border:1px solid #17499c;background:rgba(9,34,74,.6);color:#9fd8ee;white-space:nowrap}
.chip.up{border-color:#0bc78c;color:#8ff0cc;background:rgba(11,199,140,.14)}
.chip.down{border-color:#ff5c6c;color:#ffb3bc;background:rgba(255,92,108,.14)}
.chip.neu{border-color:#2b6fd0;color:#cfeaff}
.spark{display:block;width:100%;height:26px;margin-top:6px}
.extremes{display:flex;justify-content:space-between;gap:4px;margin-top:5px;border-top:1px solid #173158;padding-top:5px}
.extremes div{font-size:10px;color:#8fb0d8;text-align:center;flex:1;line-height:1.35}
.extremes div b{display:block;color:#e8f3ff;font-size:11.5px;font-variant-numeric:tabular-nums}
.extremes div.hi b{color:#6ef0b4}
.extremes div.lo b{color:#ffb3bc}
/* ---- 区块 ---- */
.block{margin-top:10px}
.block h2{font-size:12.5px;color:#00aaff;margin:8px 6px 6px;font-weight:700;display:flex;align-items:center;gap:8px}
.block h2 em{font-style:normal;color:#7fd2ee;font-size:11px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 4px}
.grid.q{grid-template-columns:repeat(3,1fr)}
.panel{position:relative;background:linear-gradient(180deg,#08122c,#050d22);border:1px solid #153db0;border-radius:9px;box-shadow:inset 0 7px 17px var(--glow);padding:8px 8px 4px}
.panel-title{font-size:12px;margin:2px 4px 2px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.panel-title .pt-name{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
.panel-title i{font-style:normal;color:#7fd2ee;font-size:10px}
/* 图表卡片右上角：最大 / 平均 / 最低（原本画在图里的 markPoint 文字标签挪到这里，
   既让数值更好找，也不再压住时间坐标轴） */
.panel-stats{display:flex;gap:12px;flex:0 0 auto;text-align:right}
.panel-stats span{font-size:9.5px;color:#8fb0d8;white-space:nowrap;line-height:1.25}
.panel-stats span b{display:block;color:#e8f3ff;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.panel-stats span i{display:block;font-style:normal;color:#6f8cb4;font-size:9px}
.panel-stats span.hi b{color:#6ef0b4}
.panel-stats span.lo b{color:#ffb3bc}
.chart{width:100%;height:232px}
.grid.q .chart{height:186px}
/* ---- 明细表 ---- */
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:7px 8px;border-bottom:1px solid #173158;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:#55d7ff;position:sticky;top:0;background:#08122c}
tbody tr:hover td{background:rgba(37,140,255,.10)}
.tbl-wrap{max-height:330px;overflow:auto;border:1px solid #153db0;border-radius:9px;background:linear-gradient(180deg,#08122c,#050d22);margin:0 4px}
.tag{display:inline-block;font-size:9px;border-radius:9px;padding:1px 7px;border:1px solid #2b6fd0;color:#9fd8ee}
.tag.warn{border-color:#8a6d10;color:#f6cf00;background:rgba(74,60,8,.5)}
/* ---- 卡片下钻弹窗（分业务明细，DRILLS 配置驱动）----
   可下钻的卡片/图表面板（总流量、缓存占比、视频三卡、游戏流量）点开同一个弹窗。
   配色全部走 --panel/--edge/--text/--muted 变量，浅色态只覆盖这三处容器色，
   不跟主题迭代的那批规则抢优先级。
   手型光标只给真正登记了下钻的（.drill），不给全部 [data-mid] ——
   不可下钻的卡显示手型会误导「能点」。 */
.card.drill,.panel.drill{cursor:pointer}
.off-mask{position:fixed;inset:0;background:rgba(2,5,12,.72);z-index:220;display:none}
.off-mask.open{display:block}
.off-modal{position:fixed;top:6vh;left:50%;transform:translateX(-50%);width:min(1080px,95vw);
  max-height:88vh;display:none;flex-direction:column;z-index:221;background:#071027;
  border:1px solid var(--edge);border-radius:12px;box-shadow:0 18px 46px rgba(0,0,0,.55)}
.off-modal.open{display:flex}
.off-head{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--edge)}
.off-head b{font-size:14px;color:var(--text)}
.off-head em{font-size:11px;color:var(--muted);font-style:normal;flex:1}
.off-head button{font:inherit;font-size:12px;color:var(--text);background:transparent;
  border:1px solid var(--edge);border-radius:7px;padding:2px 9px;cursor:pointer}
.off-note{padding:7px 14px;font-size:10.5px;line-height:1.5;color:var(--muted);border-bottom:1px solid var(--edge)}
.off-body{overflow:auto;padding:0 4px 6px}
.off-tbl th{color:var(--muted);background:#071027;position:sticky;top:0}
.off-tbl th,.off-tbl td{border-bottom-color:#173158}
.off-tbl td.pct{font-weight:700}
.off-tbl tr.tot td{border-top:1px solid var(--edge);border-bottom:none;font-weight:700;background:rgba(37,140,255,.12)}
.off-tbl tr.brk td{color:var(--muted);font-style:italic}
html[data-theme="light"] .off-mask{background:rgba(180,208,222,.62)}
html[data-theme="light"] .off-modal{background:#f4fbfe;box-shadow:0 18px 40px rgba(22,48,71,.22)}
html[data-theme="light"] .off-tbl th{color:#0e7490;background:#f4fbfe}
html[data-theme="light"] .off-tbl th,html[data-theme="light"] .off-tbl td{border-bottom-color:rgba(14,116,144,.18)}
html[data-theme="light"] .off-tbl tr.tot td{background:rgba(14,116,144,.08)}
/* ---- 说明条 ---- */
.notes-wrap{padding:8px 8px 2px;display:flex;flex-direction:column;align-items:center}
.notes-toggle{cursor:pointer;border:1px solid #17499c;background:rgba(9,34,74,.6);color:#9fd8ee;border-radius:20px;padding:4px 12px;font-size:11px;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.notes-toggle:hover{border-color:#2b6fd0;color:#cfeaff}
.notes-toggle .caret{font-size:9px;transition:transform .15s}
.notes-toggle[aria-expanded="true"] .caret{transform:rotate(180deg)}
.cover{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 2px;font-size:11px;color:#9fd8ee;justify-content:center;max-width:1400px}
.cover span{padding:4px 10px;border:1px solid #17499c;border-radius:20px;background:rgba(9,34,74,.6)}
.cover span.warn{border-color:#8a6d10;color:#f6cf00;background:rgba(74,60,8,.5)}
.cover span.bad{border-color:#8a2330;color:#ff9aa6;background:rgba(74,12,22,.5)}
/* 状态条**不再浮动**：原来 position:fixed 会盖住页面右下角卡片（含「最低」那一格），
   现在放在文档流最底部居中，只有滚到底才看到；「是否刷新成功」由顶栏的
   数据截至/页面版本/下次自动刷新 一并体现，不靠浮层提示。 */
.status{margin:8px auto 2px;width:max-content;max-width:96%;padding:5px 12px;border-radius:20px;font-size:11px;border:1px solid #16bfe3;background:#092348;color:#8cecff}
.status.bad{border-color:#ff5c6c;color:#ffb3bc;background:#480a14}
/* 业务结构（Service Mix）与网络质量（Network Quality）并排同一行 */
.mixrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
@media(max-width:1200px){.mixrow{grid-template-columns:1fr}}
.empty{padding:26px;text-align:center;color:#9fd8ee;font-size:13px}
/* ---- 浅色主题 ---- */
html[data-theme="light"]{--bg:var(--legacy-page-bg,#e9eef3);--text:#163047;--muted:#526b7d;--edge:rgba(14,116,144,.18);--glow:rgba(14,165,233,.10)}
html[data-theme="light"],html[data-theme="light"] body{background:var(--legacy-page-bg,#e9eef3);color:var(--text);color-scheme:light}
/* 浅色页面底：原先左上角 (15% 5%) 有个 rgba(103,232,249,.36) 的青色光斑，
   与右上/右下区域不同亮度，导致四角背景不同色。这里把光斑大幅减弱并拉平，
   四个角的背景亮度统一。 */
html[data-theme="light"] .screen{background:var(--legacy-screen-bg,linear-gradient(155deg,#e9eef3 0%,#f5f7f9 52%,#e7edf2 100%))}
html[data-theme="light"] .mast{background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(239,249,253,.70) 73%,transparent 74%);border-top-color:rgba(14,116,144,.22)}
/* 顶栏底部那条彩色横条（.mast:after）在浅色主题下原本**没有任何覆盖**，
   于是深色态那套 #1a35ae→#1da7ff→#03dcef→#3545b4 直接透在白底上：
   左段呈淡紫 #bfccff、右段呈淡青 #b3ffff —— 左上角与右上角背景色不一致。
   这里改为单一青色家族，两端淡出，中间实，与右上角 .viewbtn 的青色同源。 */
html[data-theme="light"] .mast:after{background:linear-gradient(90deg,rgba(14,116,144,.10) 0 13%,rgba(14,165,233,.55) 15% 41%,transparent 44% 58%,rgba(14,165,233,.55) 60% 85%,rgba(14,116,144,.10) 87%)}
/* 中间标题 + 右下副标题：与右上角按钮同品牌青，副标题降一档保持层次 */
html[data-theme="light"] .mast h1{color:#0e7490;text-shadow:none}html[data-theme="light"] .mast .sub{color:#0e7490;opacity:.78}
/* 左上角 VMAX 标志统一到右上角 .viewbtn / 中间 h1 的同一品牌青体系：
   标题 #0e7490 是主色，副标题 #3c7d94 是同色系降一档。
   这里让 VMAX 用主色 #0e7490（与右上角刷新按钮完全一致），
   "V" 保留强调金 #d69b00 —— 品牌识别点不改。
   给 .logo 加 text-shadow:0 0 8px rgba(29,167,255,.35)，与 .viewbtn 的
   box-shadow rgba(0,203,255,.25) 形成同一支 cyan glow，「上角附件」也就有了
   与「右上」同款的探照光氛围。 */
html[data-theme="light"] .logo{color:#0e7490;text-shadow:1px 1px 0 rgba(255,255,255,.8),0 0 8px rgba(29,167,255,.35)}html[data-theme="light"] .logo b{color:#d69b00;text-shadow:0 0 10px rgba(217,155,0,.45)}
html[data-theme="light"] .viewbtn{border-color:rgba(14,116,144,.30);background:rgba(255,255,255,.72);color:#0e7490}
html[data-theme="light"] .asof{background:rgba(255,255,255,.8);border-color:rgba(14,116,144,.3);color:#0e7490}
html[data-theme="light"] .cover-chip.warn{border-color:#c9a227;color:#8a6d10;background:rgba(255,250,220,.9)}
html[data-theme="light"] .lbl{color:#3c7d94}
/* 区块标题行：标题在左、该区块的主控在右，窄屏自动折行 */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.gran{display:inline-flex;align-items:center;gap:8px}
/* 卡片区浅色主题（modern glass 化第一步：与项目外壳 --wh-* 令牌同源）。
   改写参考 Task\my_app\frontend\src\index.css:160-210 浅色档值。
   装饰条（.card::before）保留：它是文档视觉基因，剥掉就连"原版骨架"都没了。
   大数字字号保留 30px / 小卡 23px：CEO 看板需要数据冲击，外壳 StatCard 22~26px 给不了这个分量。
   chip 取色采用外壳状态色 --wh-ok / --wh-danger，与外壳其它页面一致（提升可读性）。 */
html[data-theme="light"] .card{
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.82) 0%, rgba(241, 245, 248, 0.68) 100%);
  border-color: rgba(94, 125, 143, 0.22);
  box-shadow: 0 2px 8px rgba(38, 70, 86, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.94);
  -webkit-backdrop-filter: blur(20px) saturate(135%);
          backdrop-filter: blur(20px) saturate(135%);
}
html[data-theme="light"] .card .ttl b{color:#16233b}                     /* --wh-text */
html[data-theme="light"] .card .ttl i{color:#3f5468}                     /* --wh-text-muted（保持文档原 el 单位色，从蓝系换到中性，不与主标题抢色） */
html[data-theme="light"] .card .val span{color:#16233b;font-size:30px}    /* 主数字 --wh-text，保留 30px 视觉冲击 */
html[data-theme="light"] .card .val em{color:#3f5468}                     /* --wh-text-muted */
html[data-theme="light"] .card .when{color:#5b7288}                      /* --wh-text-dim */
html[data-theme="light"] .card.sm .val span{color:#16233b;font-size:23px}/* 小卡保留 23px */
html[data-theme="light"] .card::before{                                   /* 装饰条换中性极淡色（保留但不再刺眼） */
  background: linear-gradient(180deg, rgba(94,125,143,.32), rgba(94,125,143,.10));
}
html[data-theme="light"] .extremes{border-top-color:rgba(94,125,143,.16)}
html[data-theme="light"] .extremes div{color:#3f5468}                    /* --wh-text-muted */
html[data-theme="light"] .extremes div b{color:#16233b}                  /* --wh-text */
html[data-theme="light"] .extremes div.hi b{color:#0f9d58}               /* --wh-ok  */
html[data-theme="light"] .extremes div.lo b{color:#d93025}               /* --wh-danger */
html[data-theme="light"] .chip{                                           /* 中性 chip */
  border-color: rgba(94, 125, 143, 0.28); background: rgba(255, 255, 255, 0.62); color: #3f5468;
}
html[data-theme="light"] .chip.up{                                        /* 涨（好）：用外壳 ok */
  border-color: rgba(15, 157, 88, 0.55); color: #0f9d58; background: rgba(15, 157, 88, 0.10);
}
html[data-theme="light"] .chip.down{                                      /* 跌（坏）：用外壳 danger */
  border-color: rgba(217, 48, 37, 0.55); color: #d93025; background: rgba(217, 48, 37, 0.10);
}
html[data-theme="light"] .chip.neu{                                       /* 与中性 chip 同色 */
  border-color: rgba(94, 125, 143, 0.28); background: rgba(255, 255, 255, 0.62); color: #3f5468;
}
html[data-theme="light"] .extremes{border-top-color:rgba(14,116,144,.16)}
html[data-theme="light"] .extremes div{color:#4d6c7f}
html[data-theme="light"] .extremes div b{color:#12394d}
html[data-theme="light"] .extremes div.hi b{color:#0a6a52}
html[data-theme="light"] .extremes div.lo b{color:#a2202f}
html[data-theme="light"] .block h2{color:#087a98}html[data-theme="light"] .block h2 em{color:#3c7d94}
html[data-theme="light"] .panel{background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(255,255,255,.62));border-color:rgba(14,116,144,.18);box-shadow:0 16px 34px rgba(38,83,104,.12),inset 0 1px 0 rgba(255,255,255,.9)}
html[data-theme="light"] .panel-title{color:#164257}html[data-theme="light"] .panel-title i{color:#3c7d94}
html[data-theme="light"] .panel-stats span{color:#4d6c7f}
html[data-theme="light"] .panel-stats span b{color:#12394d}
html[data-theme="light"] .panel-stats span i{color:#6c8a99}
html[data-theme="light"] .panel-stats span.hi b{color:#0a6a52}
html[data-theme="light"] .panel-stats span.lo b{color:#a2202f}

 * 只有直接被单独打开（不在 iframe 里）时才用下面的 5 分钟兜底自刷。 */
var REFRESH_MS=300000;
function embedded(){ try{ return !!(window.parent&&window.parent!==window) }catch(e){ return true } }

   本页默认 900s（数据每天 06:20 才增量一次）见 App.tsx 的 AR_PAGE_DEFAULTS。 */
function shellRefreshSec(){
  try{
    var raw=localStorage.getItem('myapp_auto_refresh_effective');
    if(raw==null)raw=localStorage.getItem('myapp_auto_refresh_sec');
    if(raw==null)return null;
    var v=parseInt(raw,10); return isNaN(v)?null:v;
  }catch(e){ return null }
}
function arText(){
  var sec=shellRefreshSec(), inShell=embedded(), s=(sec!=null)?sec:(inShell?300:REFRESH_MS/1000);
  if(s===0) return t('arOff');
  var human=(s>=60)?(Math.round(s/60)+(LOCALE==='en'?' min':' 分钟')):(s+(LOCALE==='en'?' s':' 秒'));
  var next='';
  if(lastLoadedAt){                     // 让「会不会自动刷新」看得见：显示下一次时间
    var d=new Date(lastLoadedAt+s*1000), p=function(n){return (n<10?'0':'')+n};
    next=' · '+(LOCALE==='en'?'next ':'下次 ')+p(d.getHours())+':'+p(d.getMinutes());
  }
  return t('arOn')+' '+human+next;
}

function stampVersion(){
  var el=document.getElementById('verLabel'); if(!el)return;
  el.title=t('verTip');            // 说明这个时间是「页面文件时间」，不是「数据时间」
  try{
    fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){
      var lm=r.headers.get('Last-Modified'); if(!lm)return;
      var d=new Date(lm); if(isNaN(d.getTime()))return;
      var p=function(n){return (n<10?'0':'')+n};
      el.textContent=t('ver')+' '+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());

  }catch(e){ /* HEAD 失败就不显示，不影响主流程 */ }

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(v,digits){if(v==null||v==='')return '—';var n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:digits==null?2:digits}):esc(v)}
function pct(v){if(v==null||!Number.isFinite(Number(v)))return null;return (v>0?'+':'')+Number(v).toFixed(1)+'%'}
function setStatus(msg,ok){var e=document.getElementById('status');e.textContent=msg;e.className='status '+(ok?'ok':'bad')}
function chart(id){ if(charts[id]){try{charts[id].dispose()}catch(e){}} charts[id]=echarts.init(document.getElementById(id),null,{renderer:'canvas'}); return charts[id]; }

/* 迷你走势：纯 SVG（不额外起 ECharts 实例） */
function sparkline(values,color){
  var pts=(values||[]).filter(function(v){return v!=null&&Number.isFinite(Number(v))}).map(Number);
  if(pts.length<2)return '<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none"></svg>';
  var min=Math.min.apply(null,pts),max=Math.max.apply(null,pts),span=(max-min)||1,n=pts.length;
  var step=100/(n-1);
  var line=pts.map(function(v,i){var x=(i*step).toFixed(2),y=(24-((v-min)/span*20)).toFixed(2);return x+','+y}).join(' ');
  var area='0,26 '+line+' 100,26';
  var gid='sg'+Math.random().toString(36).slice(2,8);
  return '<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.42"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<polygon points="'+area+'" fill="url(#'+gid+')"/>'+
    '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.4" stroke-linejoin="round"/></svg>';
}

/* 同比涨跌的配色：better=up 涨绿跌红；better=down 反过来；flat 中性 */
function chipCls(metricId,v){
  var m=(payload.metrics||[]).filter(function(x){return x.id===metricId})[0]||{better:'up'};
  if(v==null)return 'chip neu';
  if(m.better==='flat')return 'chip neu';
  var good=(m.better==='down')? (v<0) : (v>0);
  if(Math.abs(v)<0.05)return 'chip neu';
  return 'chip '+(good?'up':'down');
}

/* 写标题时只替换 <h2> 的文本节点，保留其中的 <em id="...Sub"> 子元素。
   反面教材：直接 h2.innerHTML='标题 <em>副标题</em>' 会把原来的 <em id> 元素一起丢掉，
   后面 getElementById('hTrendSub') 就拿到 null → 渲染中途抛错（图表/表格停在旧内容）。 */
function setHead(h2Id,subId,label,sub){
  var h2=document.getElementById(h2Id); if(!h2)return;
  var em=document.getElementById(subId);
  [].slice.call(h2.childNodes).forEach(function(n){ if(n.nodeType===3) h2.removeChild(n) });
  h2.insertBefore(document.createTextNode(label+' '),h2.firstChild);
  if(em) em.textContent=sub||'';
}

/* ==================== 图表 ==================== */
function seriesFor(id){
  var s=payload.series[GRAN];
  return {labels:(GRAN==='day'? s.dates : s.labels), values:(s.values||{})[id]||[]};
}
/* 上游缺数的日子：在按天趋势上打一条淡红色竖带，避免 CEO 把「数据缺失」误读成业务暴跌 */
function suspectAreas(labels){
  var days={}; (payload.quality||[]).forEach(function(q){ if(q&&q.day) days[q.day]=q; });
  var areas=[];
  Object.keys(days).forEach(function(d){
    if(labels.indexOf(d)<0)return;
    areas.push([{xAxis:d,itemStyle:{color:'rgba(255,92,108,.14)'}},{xAxis:d}]);
  });
  return areas;
}
function ma(values,win){
  var out=[],sum=0,buf=[];
  for(var i=0;i<values.length;i++){
    var v=values[i]===null?null:Number(values[i]);
    buf.push(v); if(buf.length>win)buf.shift();
    var nums=buf.filter(function(x){return x!=null&&Number.isFinite(x)});
    out.push(nums.length===win? nums.reduce(function(a,b){return a+b},0)/win : null);
  }
  return out;
}
function optionFor(id,big){
  var m=metricMeta(id), s=seriesFor(id), digits=m.digits==null?2:m.digits;
  var dayMode=(GRAN==='day');
  var series=[{
    name:(LOCALE==='en'?(m.title_en||id):(m.title||id)), type:'line', smooth:true, symbol:'none',
    data:s.values, lineStyle:{width:2,color:isLight()?'#0e7490':'#25c8ff'},
    areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[
      {offset:0,color:isLight()?'rgba(14,116,144,.30)':'rgba(37,200,255,.38)'},
      {offset:1,color:'rgba(37,140,255,0)'}]}},
    /* 最大/最小只留一个小圆点做位置锚点，数值文字移到卡片右上角（见 panelStats），
       避免文字标签压住时间坐标轴 */
    markPoint:{symbol:'circle',symbolSize:big?8:6,itemStyle:{color:isLight()?'#0e7490':'#25c8ff',
      borderColor:isLight()?'#ffffff':'#04101f',borderWidth:1},label:{show:false},data:[
      {type:'max',name:t('max')},{type:'min',name:t('min')}]},
    markArea:(dayMode?{silent:true,data:suspectAreas(s.labels)}:undefined)
  }];
  if(dayMode&&big){
    series.push({name:(LOCALE==='en'?'7-day avg':'7日均线'),type:'line',smooth:true,symbol:'none',
      data:ma(s.values,7),lineStyle:{width:1.2,type:'dashed',color:isLight()?'#c2334a':'#ffb45c'},itemStyle:{color:isLight()?'#c2334a':'#ffb45c'}});
  }
  return {
    animationDuration:420,
    grid:{left:54,right:16,top:big?24:16,bottom:30},
    tooltip:{trigger:'axis',backgroundColor:isLight()?'rgba(255,255,255,.96)':'rgba(6,14,32,.94)',
      borderColor:isLight()?'rgba(14,116,144,.3)':'#153db0',textStyle:{color:txt(),fontSize:11},
      axisPointer:{type:'line',lineStyle:{color:isLight()?'rgba(14,116,144,.45)':'rgba(37,200,255,.45)'}},
      valueFormatter:function(v){return fmt(v,digits)}},
    legend:big?{top:0,right:6,textStyle:{color:muted(),fontSize:10},itemWidth:12,itemHeight:8}:undefined,
    /* 时间坐标轴：标签只留「月-日」/「W37」，间距交给 ECharts 自动算（interval:'auto'），
       重叠再兜底隐藏（hideOverlap）——90 个点也不会糊成一片，首尾标签也不会被切掉 */
    xAxis:{type:'category',data:s.labels,boundaryGap:(GRAN!=='day'),axisTick:{show:false},
      axisLine:{lineStyle:{color:axisCol()}},
      axisLabel:{color:muted(),fontSize:9,margin:9,interval:'auto',hideOverlap:true,
        formatter:function(v){var x=String(v==null?'':v);
          return GRAN==='day'?(x.length>=10?x.slice(5):x):x.replace(/^\d{4}-/,'')}},
      splitLine:{show:false}},
    yAxis:{type:'value',scale:true,axisLine:{show:false},axisLabel:{color:muted(),fontSize:9,
        formatter:function(v){return fmt(v,0)}},splitLine:{lineStyle:{color:splitCol()}}},
    series:series
  };

/* 卡片右上角的 最大 / 平均 / 最低：按「当前粒度正在展示的那条序列」现算，
   切日/周或刷新后由 renderAll 重新生成 */
function panelStats(id,digits){
  var s=seriesFor(id), labels=s.labels||[];
  var vals=[],idx=[];
  (s.values||[]).forEach(function(v,i){ var n=Number(v); if(v!=null&&isFinite(n)){vals.push(n);idx.push(i)} });
  if(!vals.length)return '';
  var mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals);
  var avg=vals.reduce(function(a,b){return a+b},0)/vals.length;
  function lab(v){ var x=String(labels[idx[vals.indexOf(v)]]==null?'':labels[idx[vals.indexOf(v)]]);
    return GRAN==='day'?(x.length>=10?x.slice(5):x):x.replace(/^\d{4}-/,''); }
  return '<div class="panel-stats">'+
    '<span class="hi">'+esc(t('max'))+'<b>'+fmt(mx,digits)+'</b><i>'+esc(lab(mx))+'</i></span>'+
    '<span>'+esc(t('avg'))+'<b>'+fmt(avg,digits)+'</b><i>'+esc(vals.length+(LOCALE==='en'?' pts':' 点'))+'</i></span>'+
    '<span class="lo">'+esc(t('min'))+'<b>'+fmt(mn,digits)+'</b><i>'+esc(lab(mn))+'</i></span>'+
  '</div>';
}
function panelHtml(id,big){
  var m=metricMeta(id), digits=m.digits==null?2:m.digits;
  var unit=esc(m.unit||'');
  var note=(LOCALE==='en'?(m.note_en||m.note):m.note)||'';
  var extra='';
  if(GRAN==='week'&&payload.series.week.days&&payload.series.week.days.length){
    var ds=payload.series.week.days, last=ds[ds.length-1];
    if(last<7)extra=' · '+(LOCALE==='en'?('last week '+last+'d'):('最后一周 '+last+' 天'));
  }
  // 口径说明改成 hover 提示（ⓘ），把卡片右上角腾给 最大/平均/最低
  return '<div class="panel'+(DRILLS[id]?' drill':'')+'" data-mid="'+esc(id)+'"><div class="panel-title">'+
    '<span class="pt-name" title="'+esc(note)+'">'+esc(LOCALE==='en'?(m.title_en||id):(m.title||id))+
      ' <i>'+unit+'</i>'+(note?' <i>ⓘ</i>':'')+esc(extra)+'</span>'+
    panelStats(id,digits)+
    '</div><div class="chart" id="ch_'+id+'"></div></div>';
}

/* 逐日明细：不发请求，直接读 payload.series.day —— 卡面的「最新值」就是从这里取的
   （payload.cards[].latest），所以只有**日口径**才能保证「明细某一行 = 卡面数字」。
   两件事必须说清楚，不能让人以为界面自相矛盾：
     ① 上方「日/周」开关只作用于曲线聚合，卡片与本明细一律是日口径 —— 实测卡面
        「Latest · 2026-10-29」切到周也不变，若这里跟随周就会拿 454.9 去对 453.1。
     ② 窗口末端当天可能还没落库（值=—），卡面会自动退到上一个有值的日子。
        因此高亮卡面真正取自哪一行，空值行保留但排在其后并标出，不做静默丢弃。 */
function fillSeriesDrill(){
  var mid=activeDrill, m=metricMeta(mid);
  var s=(payload&&payload.series&&payload.series.day)||{};
  var xs=s.dates||[], ys=s.values||{};
  var arr=ys[mid]||[];
  var digits=(m.digits==null?2:m.digits), unit=m.unit||'';
  var body=document.getElementById('offBody'), meta=document.getElementById('offMeta'), note=document.getElementById('offNote');
  var card=null; (payload.cards||[]).forEach(function(c){ if(c.id===mid) card=c; });
  var cardDate=card&&card.latest?card.latest.date:null;
  document.getElementById('offTitle').textContent=
    (LOCALE==='en'?(m.title_en||m.title):(m.title||''))+' · '+t('sDetailDay');
  if(!xs.length||!arr.length){
    body.innerHTML='<div class="empty">'+esc(t('dEmpty'))+'</div>'; meta.textContent=''; note.textContent=''; return;
  }
  var missTail=0; for(var k=arr.length-1;k>=0&&arr[k]==null;k--) missTail++;
  var rows='';
  for(var i=xs.length-1;i>=0;i--){                 // 最近的排最前，与看板「最新值」的阅读顺序一致
    var v=arr[i], pv=i>0?arr[i-1]:null;
    var chg='—';
    if(v!=null&&pv!=null&&pv!==0){ var pc=(v-pv)/Math.abs(pv)*100; chg=(pc>=0?'+':'')+pc.toFixed(1)+'%'; }
    var isCard=(cardDate!=null&&xs[i]===cardDate);
    rows+='<tr'+(isCard?' class="tot"':'')+'><td>'+esc(xs[i])+(isCard?' ◀':'')+'</td>'+
      '<td class="pct">'+(v==null?'—':fmt(v,digits))+'</td><td>'+esc(chg)+'</td></tr>';
  }
  body.innerHTML='<table class="off-tbl"><thead><tr><th>'+esc(t('sThDay'))+'</th><th>'+
    esc(t('sThVal'))+(unit?'（'+esc(unit)+'）':'')+'</th><th>'+esc(t('sThChg'))+'</th></tr></thead><tbody>'+
    rows+'</tbody></table>';
  meta.textContent=t('offMeta')+' '+(payload.as_of||'—')+' · '+(xs.length-missTail)+'/'+xs.length+' '+t('offDays');
  note.textContent=t('sNote');
}
function fillDrillModal(){
  var cfg=DRILLS[activeDrill], body=document.getElementById('offBody');
  var meta=document.getElementById('offMeta'), note=document.getElementById('offNote');
  if(!cfg){ body.innerHTML=''; meta.textContent=''; note.textContent=''; return; }
  if(cfg.series){ fillSeriesDrill(); return; }     // 明细在 payload 里，没有 api 可取
  document.getElementById('offTitle').textContent=t(cfg.title);
  var d=drillCache[cfg.api];
  if(!d){
    body.innerHTML='<div class="empty">'+esc(t(drillLoading[cfg.api]?'dLoading':'dEmpty'))+'</div>';
    meta.textContent=''; note.textContent=''; return; }
  if(d.status!=='ok'){
    body.innerHTML='<div class="empty">'+esc(d.message||d.error||t('dFailed'))+'</div>';
    meta.textContent=''; note.textContent=''; return; }
  var sc=detailScope(d.day)||detailScope(d.window_agg);
  if(!sc){
    body.innerHTML='<div class="empty">'+esc(t('dEmpty'))+'</div>';
    meta.textContent=''; note.textContent=''; return; }
  var n=(sc.rows||[]).length, rest=Math.max(0,((sc.totals&&sc.totals.apps)||n)-n);
  var html=(sc.rows||[]).map(function(r){return detailRow(r,cfg.cols)}).join('');
  if(sc.others) html+=detailRow(sc.others,cfg.cols,t(cfg.othersTk||'offOthers').replace('{n}',String(rest)),'brk');
  if(sc.totals) html+=detailRow(sc.totals,cfg.cols,t('offTotals'),'tot');
  var head='<tr><th>'+esc(t(cfg.th||'offThApp'))+'</th>'+
    cfg.cols.map(function(c){return '<th>'+esc(t(c.tk))+'</th>'}).join('')+'</tr>';
  body.innerHTML='<table class="off-tbl"><thead>'+head+'</thead><tbody>'+html+'</tbody></table>';
  var w=d.window||{};
  meta.textContent=t('offMeta')+' '+(d.as_of||'—')+
    ' · '+(w.stored_days||0)+'/'+(d.window_days||90)+' '+t('offDays')+
    (sc===d.day?'':' · '+t('week'));
  note.textContent=t(cfg.note);
}
function fetchDrill(){
  var cfg=DRILLS[activeDrill]; if(!cfg) return;
  if(!cfg.api) return;   // series:true 的逐日明细没有接口，数据就在 payload 里；
                         // 少了这道守卫，fetch(undefined) 会把当前页 URL 当接口拉回来
  if(drillCache[cfg.api]||drillLoading[cfg.api]) return;
  drillLoading[cfg.api]=true;
  fetch(cfg.api,{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      // 路由未就绪时网关会回 SPA 的 index.html（200 + HTML），r.json() 的报错是
      // 「Unexpected token '<'」这种天书 —— 先取文本再解析，失败给本地化提示
      return r.text().then(function(text){
        try { return JSON.parse(text); }
        catch(e){ throw new Error('HTTP '+r.status+' · '+t('dFailed')); }
      }); })
    .then(function(d){ drillCache[cfg.api]=d; })
    .catch(function(e){ drillCache[cfg.api]={status:'error', message:String(e && e.message || e)}; })
    .then(function(){ drillLoading[cfg.api]=false; if(detailOpen()&&activeDrill) fillDrillModal(); });
}
function openDrill(mid){
  if(!DRILLS[mid]) return;
  activeDrill=mid;
  document.getElementById('offMask').classList.add('open');
  document.getElementById('offModal').classList.add('open');
  fillDrillModal();                          // 先画出「正在取明细…」，再懒加载
  fetchDrill();
}
function closeDrill(){
  activeDrill=null;
  document.getElementById('offMask').classList.remove('open');
  document.getElementById('offModal').classList.remove('open');
}
function detailOpen(){
  return document.getElementById('offModal').classList.contains('open');
}

function drawAll(){
  PRIMARY_CHART_IDS.forEach(function(id){ try{chart('ch_'+id).setOption(optionFor(id,true),true)}catch(e){} });
  QUALITY_CHART_IDS.forEach(function(id){ try{chart('ch_'+id).setOption(optionFor(id,false),true)}catch(e){} });
}

/* ==================== 明细表 ==================== */
function renderTable(){
  var rows=payload.table||[];
  var head='<thead><tr><th>'+esc(t('thDate'))+'</th><th>'+esc(t('thTraffic'))+'</th><th>'+esc(t('thUser'))+
    '</th><th>'+esc(t('thVideo'))+'</th><th>'+esc(t('thRate'))+'</th><th>'+esc(t('thCache'))+'</th><th>'+esc(t('thTcp'))+
    '</th><th>'+esc(t('thTop'))+'</th><th>'+esc(t('thQ'))+'</th></tr></thead>';
  var body=rows.map(function(r){
    return '<tr><td>'+esc(r.date)+'</td><td>'+fmt(r.traffic_gb,0)+'</td><td>'+fmt(r.active_user,0)+'</td>'+
      '<td>'+fmt(r.video_gb,0)+'</td><td>'+fmt(r.video_thr_kbps,0)+'</td><td>'+fmt(r.cache_ratio_pct,1)+'</td>'+
      '<td>'+fmt(r.tcp_success_pct,2)+'</td><td>'+esc(r.top_service||'—')+'</td>'+
      '<td>'+(r.suspect? '<span class="tag warn">'+esc(t('suspect'))+'</span>'
             :(r.incomplete? '<span class="tag warn">'+esc(t('incomplete'))+'</span>'
               : '<span class="tag">'+esc(t('ok'))+'</span>'))+'</td></tr>';
  }).join('');
  document.getElementById('tbl').innerHTML=head+'<tbody>'+body+'</tbody>';
}

/* ==================== 渲染 + 取数 ==================== */
function renderAll(){
  var m=payload.metrics||[];
  var byGroup=function(g){return m.filter(function(x){return x.group===g})};
  var byId={}; (payload.cards||[]).forEach(function(c){byId[c.id]=c});
  var fill=function(elem,list,small){
    document.getElementById(elem).innerHTML=list.map(function(x){
      return byId[x.id]?cardHtml(byId[x.id],small):''}).join('');
  };
  fill('cardsPrimary',byGroup('primary'),false);
  fill('cardsBusiness',byGroup('business'),false);
  fill('cardsQuality',byGroup('quality'),false);
  document.getElementById('chartsPrimary').innerHTML=PRIMARY_CHART_IDS.map(function(id){return panelHtml(id,true)}).join('');
  document.getElementById('chartsQuality').innerHTML=QUALITY_CHART_IDS.map(function(id){return panelHtml(id,false)}).join('');
  renderTable();
  var cov=payload.coverage||{};
  document.getElementById('asof').textContent=t('asof')+' '+(payload.as_of||'—')+
    '  ·  '+(cov.stored_days||0)+'/'+(cov.expected_days||90)+(LOCALE==='en'?' days':' 天')+
    (payload.updated_at?('  ·  sync '+payload.updated_at):'');
  // 数据完整性提示：整行缺失(missing_days) + 行在但关键列为空(incomplete_days) 都算缺口。
  // 没有缺口就不显示，保持原有观感。
  var gapDays=(cov.missing_days||[]).concat(cov.incomplete_days||[]);
  var gapUniq=[]; gapDays.forEach(function(d){ if(gapUniq.indexOf(d)<0)gapUniq.push(d); });
  var covChip=document.getElementById('covChip');
  if(covChip){
    if(gapUniq.length){
      covChip.className='cover-chip warn';
      covChip.textContent='⚠ '+t('covGap')+' '+(cov.stored_days||0)+'/'+(cov.expected_days||90)+
        ' '+t('covDays')+' · '+t('covMiss')+' '+gapUniq.length+' '+t('covDays')+
        ' ('+gapUniq.slice(0,3).join(', ')+(gapUniq.length>3?'…':'')+')';
      covChip.hidden=false;
    }else{ covChip.hidden=true; covChip.textContent=''; }
  }
  var gWord=(GRAN==='day'?t('day'):t('week'));
  document.getElementById('hTrendSub').textContent=gWord+' · '+
    (LOCALE==='en'?'last 90 days':'最近 90 天');
  /* 同一个粒度还驱动下方 6 张质量图（共 10 张），那里也标出来：
     否则开关只写在 Business Trends 标题上，质量区的图看起来像不受它管。 */
  var hqSub=document.getElementById('hQualitySub');
  if(hqSub) hqSub.textContent=gWord+' · '+t('qualitySub');
  if(detailOpen()) fillDrillModal();    // 切语言/刷新后弹窗文案跟着重绘（表格用缓存，不重拉）
  drawAll();
}
function renderEmpty(msg){
  var html='<div class="empty">'+esc(msg||t('empty'))+'</div>';
  document.getElementById('cardsPrimary').innerHTML=html;
  document.getElementById('cardsBusiness').innerHTML='';
  document.getElementById('cardsQuality').innerHTML='';
  document.getElementById('chartsPrimary').innerHTML='';
  document.getElementById('chartsQuality').innerHTML='';
  document.getElementById('tbl').innerHTML='';
  document.getElementById('asof').textContent='—';
  var chip=document.getElementById('covChip');
  if(chip){ chip.hidden=true; chip.textContent=''; }
}
function load(){
  setStatus(t('loading'),true);
  fetch(API,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(d){
      payload=d;
      if(d.status!=='ok'){ renderEmpty(d.message); setStatus((d.status||'empty')+' · '+(d.message||''),false); return; }
      renderAll();
      lastLoadedAt=Date.now();
      document.getElementById('arLabel').textContent=arText();   // 下次自动刷新时间随本次刷新顺延
      setStatus(t('loaded')+' · '+new Date().toLocaleTimeString()+' · '+(d.as_of||''),true);
    })
    .catch(function(e){ setStatus(t('failed')+': '+e.message,false); });
}
document.getElementById('refreshBtn').addEventListener('click',load);
/* 下钻入口用文档级委托：卡片与面板每次 renderAll 都整块重innerHTML，
   绑在元素上的监听会随节点一起被换掉，委托不会。 */
document.addEventListener('click',function(ev){
  var el=ev.target&&ev.target.closest?ev.target.closest('[data-mid]'):null;
  if(el&&DRILLS[el.getAttribute('data-mid')]) openDrill(el.getAttribute('data-mid'));
});
document.getElementById('offMask').addEventListener('click',closeDrill);
document.getElementById('offClose').addEventListener('click',closeDrill);
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'&&detailOpen()) closeDrill(); });
document.getElementById('granSeg').addEventListener('click',function(ev){
  var btn=ev.target.closest('button[data-gran]'); if(!btn)return;
  GRAN=btn.getAttribute('data-gran');
  [].forEach.call(this.querySelectorAll('button'),function(b){b.classList.toggle('active',b===btn)});
  try{localStorage.setItem('vmax-90d-gran',GRAN)}catch(e){}
  if(payload&&payload.status==='ok')renderAll();
});
document.getElementById('notesToggle').addEventListener('click',function(){
  var box=document.getElementById('cover'), open=box.hasAttribute('hidden');
  if(open){box.removeAttribute('hidden')}else{box.setAttribute('hidden','')}
  this.setAttribute('aria-expanded',open?'true':'false');
});
window.addEventListener('resize',function(){clearTimeout(window.__rz);window.__rz=setTimeout(resizeAll,60)});
window.addEventListener('message',function(e){
  if(!e.data)return;
  if(e.data.__type==='myapp-theme')applyTheme(e.data.mode);
  else if(e.data.__type==='myapp-locale')applyLocale(e.data.locale);
  // myapp-refresh 由 MyAppRefresh.install（见下方）统一处理，此处不再重复监听
});
try{ var g=localStorage.getItem('vmax-90d-gran'); if(g==='day'||g==='week'){GRAN=g;
  [].forEach.call(document.querySelectorAll('#granSeg button'),function(b){b.classList.toggle('active',b.getAttribute('data-gran')===g)}) } }catch(e){}
paintStatic();
if(window.echarts){
  load();
  /* 自刷新安全网（2026-10-10 新增）：统一走 MyAppRefresh 共享协议。
   * 此前仅在「非嵌入」时自刷，嵌入外壳时完全依赖父页广播 —— 全屏/后台广播被挡则
   * 长时间不刷新。现改为常开兜底 + 广播提前触发；非看板页不启用。
   * 间隔取「生效间隔」（0=关闭；看板全屏时忽略关闭按本页默认兜底）。 */
  try{
    MyAppRefresh.install({
      defaultSec: 900,   // 与 App.tsx AR_PAGE_DEFAULTS.vmaxCxoDashboard_90Days 对齐
      onRefresh: function(){ paintStatic(); load(); },
    });
  }catch(e){}
}else{setStatus('echarts missing',false)}
})();
</script>
