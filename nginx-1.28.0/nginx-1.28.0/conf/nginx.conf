
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # -------------------------------------------------------------------------
    # 所有服务收在 80 端口，按「路径」区分：根=导航总览，各服务走子路径
    # -------------------------------------------------------------------------
    server {
        listen       80;
        server_name  localhost;

        # 请求体上限（FineBI 导入 Excel/数据集等），默认 1m 会报 413
        client_max_body_size 1024m;

        # ---- 根路径 = 服务导航总览页 ----
        location / {
            root   html;
            index  index.html index.htm;
        }

        # ---- 无尾斜杠的访问 301 到各服务入口（否则会落到根导航页或 404）----
        location = /webroot  { return 301 /webroot/decision; }
        location = /myapp    { return 301 /myapp/; }
        location = /ollama   { return 301 /ollama/; }
        location = /openclaw { return 301 /openclaw/; }
        location = /uniplam   { return 301 /uniplam/; }
        location = /my-finebi { return 301 /my-finebi/; }

        # ---- Webroot → FineBI：http://localhost/webroot/ ----
        location /webroot/ {
            proxy_pass         http://127.0.0.1:26738;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            # 长连接/WebSocket 空闲超时（默认 60s 会切断 FineBI 实时推送）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- my_app 任务管理器：http://localhost/myapp/ ----
        # 注意：proxy_pass 末尾「不要」加斜杠 = 不剥 /myapp 前缀，
        # 原样把 /myapp/... 转给 vite(7090)；vite 的 base 已是 /myapp/，
        # 若剥前缀会让 vite 把 / 重定向回 /myapp/ 造成死循环。
        location /myapp/ {
            proxy_pass         http://127.0.0.1:7090;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # 支持 vite 热更新(HMR)的 WebSocket
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- 数字化运维平台（单文件工作台，由 my_app:7038 静态服务）----
        # 让 http://host/digital-ops-platform.html 走 80 口也能打开。
        # 页面内相对路径 /api/tasks 会落到下面的通用 /api/ 兜底，已确认可达 my_app。
        location = /digital-ops-platform.html {
            proxy_pass         http://127.0.0.1:7038;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- localhost:3000 服务：http://localhost/app/ ----
        location /app/ {
            proxy_pass         http://127.0.0.1:3000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location = /app { return 301 /app/; }

        # ---- my-finebi 后端 API（必须放在通用 /api/ 之前，按最长前缀优先匹配）----
        # my-finebi 前端 axios baseURL=/api，用绝对路径调本机 7138 的 FastAPI；
        # 不加这三条会被下面的通用 /api/ 兜底规则抢走到 192.168.100.20。
        # uniplam 用的 /api/tasks 不在这些前缀内，仍走 .20，互不影响。
        location /api/dashboards {
            proxy_pass         http://127.0.0.1:7138;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /api/data/sources {
            proxy_pass         http://127.0.0.1:7138;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        # 注意：location 必须带尾部斜杠 /api/finebi/ ——
        # 否则前缀匹配会连带劫持 my_app 后端(7038)的 /api/finebi-reports/*，导致 502。
        location /api/finebi/ {
            proxy_pass         http://127.0.0.1:7138;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- API 兜底：直连本机 my_app 后端（7038）----
        # 历史上这里曾转发到 192.168.100.20:80 再绕回本机，2026-08-31 该上游
        # 连接持续失败(10048)导致全站 /api 502；后端就在本机，直接转发即可。
        location /api/ {
            proxy_pass         http://127.0.0.1:7038;
            proxy_connect_timeout 5s;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---- Ollama：http://localhost/ollama/ ----
        location /ollama/ {
            proxy_pass         http://127.0.0.1:11434/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            # 关闭缓冲：流式（逐 token）输出实时下推，不攒块
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- OpenClaw 网关：http://localhost/openclaw/ ----
        location /openclaw/ {
            proxy_pass         http://127.0.0.1:18789/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            # 关闭缓冲：SSE/流式响应实时下推
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- uniplam 数据看板：http://localhost/uniplam/ ----
        # 应用 Vite base 已设为 /uniplam/，故 proxy_pass 末尾不加斜杠、不剥前缀，
        # 原样把 /uniplam/... 转给 9267 的 vite dev server。
        location /uniplam/ {
            proxy_pass         http://127.0.0.1:9267;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- my-finebi：http://localhost/my-finebi/ ----
        location /my-finebi/ {
            proxy_pass         http://127.0.0.1:7138;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }


    # -------------------------------------------------------------------------
    # 想加更多服务，复制下面模板，改 location 路径和 proxy_pass 端口即可：
    #
    # location /<名字>/ {
    #     proxy_pass         http://127.0.0.1:<端口>/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   Upgrade           $http_upgrade;
    #     proxy_set_header   Connection        "upgrade";
    #     proxy_read_timeout 3600s;    # 有 WebSocket/长连接必加（默认 60s 会断）
    #     proxy_buffering    off;      # 有流式输出(SSE/逐token)必加
    # }
    # 同时加一条无尾斜杠跳转：
    # location = /<名字> { return 301 /<名字>/; }
    # -------------------------------------------------------------------------

}
