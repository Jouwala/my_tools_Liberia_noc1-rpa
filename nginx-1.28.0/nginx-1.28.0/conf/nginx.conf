
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # -------------------------------------------------------------------------
    # 所有服务收在 80 端口，按「路径」区分：根=导航总览，各服务走子路径
    # -------------------------------------------------------------------------
    server {
        listen       80;
        server_name  localhost;

        # ---- 根路径 = 服务导航总览页 ----
        location / {
            root   html;
            index  index.html index.htm;
        }

        # ---- my_app 任务管理器：http://localhost/myapp/ ----
        # 注意：proxy_pass 末尾「不要」加斜杠 = 不剥 /myapp 前缀，
        # 原样把 /myapp/... 转给 vite(7090)；vite 的 base 已是 /myapp/，
        # 若剥前缀会让 vite 把 / 重定向回 /myapp/ 造成死循环。
        location /myapp/ {
            proxy_pass         http://127.0.0.1:7090;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # 支持 vite 热更新(HMR)的 WebSocket
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        # ---- API 兜底：防止前端用绝对路径 /api/... 调用时落到根导航页 ----
        location /api/ {
            proxy_pass         http://127.0.0.1:7090;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        # ---- Ollama：http://localhost/ollama/ ----
        location /ollama/ {
            proxy_pass         http://127.0.0.1:11434/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        # ---- OpenClaw 网关：http://localhost/openclaw/ ----
        location /openclaw/ {
            proxy_pass         http://127.0.0.1:18789/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }


    # -------------------------------------------------------------------------
    # 想加更多服务，复制下面模板，改 location 路径和 proxy_pass 端口即可：
    #
    # location /<名字>/ {
    #     proxy_pass         http://127.0.0.1:<端口>/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   Upgrade           $http_upgrade;
    #     proxy_set_header   Connection        "upgrade";
    # }
    # -------------------------------------------------------------------------

}
