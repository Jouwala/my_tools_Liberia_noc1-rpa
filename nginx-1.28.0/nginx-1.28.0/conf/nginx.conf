
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;
# ---- 显式开启错误日志（2026-09-15）----
# 背景：TT 快速分析报「分析失败」，后端访问日志里该端点全是 200、也没有任何 500，
# 说明请求根本没到 uvicorn —— 是 nginx 侧 502（上游重启空窗）。但当时 nginx 的
# access/error 日志都没落盘，两边都查不到痕迹，只能靠杀进程实验反推。
# 这里只开 error 日志（warn 级，仅记录上游失败等错误，量很小），
# 故意不开 access_log：历史 access.log 曾涨到 470MB。
# 用绝对路径，避免 nginx 前缀不同导致日志落到别处（现象：logs/error.log 长期不更新）。
error_log  D:/01_RPA/nginx-1.28.0/nginx-1.28.0/logs/error.log  warn;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # -------------------------------------------------------------------------
    # 所有服务收在 80 端口，按「路径」区分：根=导航总览，各服务走子路径
    # -------------------------------------------------------------------------
    # =========================================================================
    # 门户反代：按 Referer 识别「门户自己发出的请求」
    # -------------------------------------------------------------------------
    # 门户页面里用的是根绝对路径（/api/oauth2/...、/uportal/...、/iui/...），
    # 早期方案用 sub_filter 把 "…/api/" 改写成 "…/portal/eflow/api/"，结果门户 JS
    # 会再对字符串做一次拼接，出现 /portal/eflow/uportal/portal/eflow/api/... 双前缀
    # 404。改为：内容一律不改写，nginx 依据 Referer 把门户的请求原样转给上游。
    # 门户与 my_app 同源（都是 192.168.100.20），浏览器默认策略对同源请求发完整
    # Referer，因此可以准确区分「门户发的」与「my_app 发的」/api/ 请求。
    # =========================================================================
    map $http_referer $portal_ref {
        default                                       "";
        "~^https?://[^/]+/portal/eflow/"              "eflow";
        "~^https?://[^/]+/(uportal|iui|framework)/"   "eflow";
    }

    # 门户有跨站访问防护（实测：带会话但来源不符时返回 403
    # "This request is prohibited for cross-site access"），故把 Origin/Referer 改成
    # 门户自己的地址。客户端没发 Origin 时保持为空（凭空加 Origin 反而会触发校验）。
    map $http_origin $portal_origin_rewritten {
        ""        "";
        default   "https://10.100.20.8:28001";
    }

    server {
        listen       80;
        server_name  localhost;

        # 请求体上限（FineBI 导入 Excel/数据集等），默认 1m 会报 413
        client_max_body_size 1024m;

        # ---- 根路径 = 服务导航总览页 ----
        location / {
            root   html;
            index  index.html index.htm;
        }

        # ---- 无尾斜杠的访问 301 到各服务入口（否则会落到根导航页或 404）----
        location = /webroot  { return 301 /webroot/decision; }
        location = /myapp    { return 301 /myapp/; }
        location = /ollama   { return 301 /ollama/; }
        location = /openclaw { return 301 /openclaw/; }
        location = /uniplam   { return 301 /uniplam/; }
        location = /my-finebi { return 301 /my-finebi/; }

        # ---- Webroot → FineBI：http://localhost/webroot/ ----
        location /webroot/ {
            proxy_pass         http://127.0.0.1:26738;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            # 长连接/WebSocket 空闲超时（默认 60s 会切断 FineBI 实时推送）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- my_app 任务管理器：http://localhost/myapp/ ----
        # 2026-09-13 变更：由「反代 vite preview(127.0.0.1:7090)」改为
        # **nginx 直接托管静态产物** D:/01_RPA/Task/_fe_dist。
        # 原因：7090 是单进程 vite preview，进程一旦重启/退出就有数秒无人监听，
        # nginx 立刻 connect() failed → 502（现象：「首次打开 502、刷新即好」）。
        # 实测证据：log/frontend_runtime.log.err 有 "Port 7090 is already in use"；
        # scripts/start-app.mjs 启动前会 killPort(7090) 先杀后启，天然存在空窗。
        # _fe_dist 是纯静态产物（index.html 只引用 /myapp/assets/*），直接 serve
        # 可彻底消除该单点，且由 nginx 提供更稳定的静态服务。
        # 前端 API 走绝对路径 /api（见下方 /api/ 兜底），不经本 location。
        # 注：7090 的 vite preview 仍可保留运行，供 mw_links_sync 等「7090 直连」校验工具使用。
        # 注：改前端后仍需 build 到 D:/01_RPA/Task/_fe_dist（本机构建即上线）。
        location /myapp/ {
            alias      D:/01_RPA/Task/_fe_dist/;
            index      index.html;
            # SPA 回退：未命中的路径交给 index.html（前端以 ?page=xxx 查询参数路由）
            try_files  $uri $uri/ /myapp/index.html;
            # 与原 vite preview 行为一致：HTML 不缓存，避免用户拿到旧构建
            add_header Cache-Control "no-cache";
        }

        # 带 hash 的构建产物可长缓存（文件名随内容变化，不会取到旧版本）
        location /myapp/assets/ {
            alias      D:/01_RPA/Task/_fe_dist/assets/;
            expires    30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # =====================================================================
        # 门户反代（客户端本机登录）
        # ---------------------------------------------------------------------
        # 背景：my_app 原本在后端(.20)桌面弹 Chrome 自动登录门户，别的电脑点了按钮
        # 只是在服务器上开浏览器。这里把门户反代到 80 口，使其与 my_app 同源，
        # 即可在登录页注入自动填表脚本 → 「在哪台电脑点，就在哪台电脑的浏览器登录」，
        # 会话 Cookie 落在访问者本机。
        # 入口统一走 /portal/eflow/（剥前缀转上游），门户页面的根绝对路径由下面
        # /uportal/ /iui/ /framework/ /api/(按 Referer) 承接。公共参数见
        # conf/portal_eflow_common.conf（Cookie 域改写、去 secure、摘 HSTS 等）。
        # =====================================================================
        location /help/     { proxy_pass https://10.100.20.8:28001; include portal_eflow_common.conf; }

        # 注：早期版本把登录页放在 /portal/eflow/ 前缀下，实测会导致门户前端按 URL 上下文
        # 拼出带前缀的 localStorage 键名（/portal/eflow_csrftoken），与登录后的主页不一致，
        # CSRF token 取不到 → 全部接口 403 "cross-site access"。已改为原生路径（见上）。

        # 门户登录后主页及其资源的根绝对路径（与 my_app 无冲突，直接转发）
        location /uportal/   { proxy_pass https://10.100.20.8:28001; include portal_eflow_common.conf; }
        location /iui/       { proxy_pass https://10.100.20.8:28001; include portal_eflow_common.conf; }
        location /framework/ { proxy_pass https://10.100.20.8:28001; include portal_eflow_common.conf; }

        # 登录页必须走「门户原生路径」/api/oauth2/v1/authorize，不能放在 /portal/eflow/ 前缀下：
        # 实测门户前端按 URL 上下文拼 localStorage 键名（csrftoken 存 CSRF token），
        # 前缀下的登录页会存成 /portal/eflow_csrftoken，而登录后的主页按无前缀去找，
        # 取不到 token → 所有接口 403 "cross-site access"。故这里按原生路径反代。
        location /api/oauth2/ {
            proxy_pass https://10.100.20.8:28001;
            include    portal_eflow_common.conf;
            sub_filter '</head>' '<script src="/api/portals/inject.js?system=eflow"></script></head>';
        }

        # ---- 数字化运维平台（单文件工作台，由 my_app:7038 静态服务）----
        # 让 http://host/digital-ops-platform.html 走 80 口也能打开。
        # 页面内相对路径 /api/tasks 会落到下面的通用 /api/ 兜底，已确认可达 my_app。
        location = /digital-ops-platform.html {
            proxy_pass         http://127.0.0.1:7038;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- localhost:3000 服务：http://localhost/app/ ----
        location /app/ {
            proxy_pass         http://127.0.0.1:3000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location = /app { return 301 /app/; }

        # ---- my-finebi 后端 API（必须放在通用 /api/ 之前，按最长前缀优先匹配）----
        # my-finebi 前端 axios baseURL=/api，用绝对路径调本机 7138 的 FastAPI；
        # 不加这三条会被下面的通用 /api/ 兜底规则抢走到 192.168.100.20。
        # uniplam 用的 /api/tasks 不在这些前缀内，仍走 .20，互不影响。
        location /api/dashboards {
            proxy_pass         http://127.0.0.1:7138;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /api/data/sources {
            proxy_pass         http://127.0.0.1:7138;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        # 注意：location 必须带尾部斜杠 /api/finebi/ ——
        # 否则前缀匹配会连带劫持 my_app 后端(7038)的 /api/finebi-reports/*，导致 502。
        location /api/finebi/ {
            proxy_pass         http://127.0.0.1:7138;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- my_app 实时告警看板 FMS 代理（Alarm Management 实时刷新）----
        # 前端 alarm-management.html 经同源 /api/realtime-proxy/fms 拉实时数据；
        # nginx 原样转发到本机 8787 FMS 实时代理（代理只绑回环，不对局域网暴露，
        # 远程访问者经 nginx 中转）。精确匹配优先于下方通用 /api/ 兜底；
        # backend 7038 将来重启后即使自带同名转发路由，此处亦不冲突。
        location = /api/realtime-proxy/fms {
            proxy_pass         http://127.0.0.1:8787/proxy;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ---- 门户 eFlow 的 API 命名空间：按 URI 直达上游，不依赖 Referer ----
        # 背景（2026-09-15 定位）：下面通用 /api/ 靠 Referer 区分「门户发的」与「my_app 发的」，
        # 但 **WebSocket 握手按规范不带 Referer**（实测 Chrome 只带 Origin，见 TMP/t_ws_referer_local.py）
        # → $portal_ref 恒为空 → cometd 被误路由到本机 7038，被鉴权中间件挡成 403
        # （后端日志 96 条 "WebSocket /api/fm-active/v1/cometd" 403，client port 显示 :0 即经 nginx）。
        # 这里给门户的 API 命名空间开专用 location：my_app 未暴露 /api/fm-active/*，
        # 前端也从不引用该路径（仅后端服务端直连门户时作为上游地址字符串出现），故无冲突。
        # "^~" 保证优先于通用 /api/ 且不参与正则匹配。
        # 注：/api/fm-active-service/ 不带 WS，仍走下面的 Referer 逻辑，此处不动。
        location ^~ /api/fm-active/ {
            proxy_pass https://10.100.20.8:28001;
            include    portal_eflow_common.conf;
        }

        # ---- API 兜底：默认直连本机 my_app 后端（7038）----
        # 若请求来自门户页面（Referer 命中 $portal_ref），则原样转给门户上游，
        # 解决门户 JS 用根绝对路径 /api/oauth2/... 与 my_app 自身 /api/ 撞车的问题。
        location /api/ {
            set $api_upstream http://127.0.0.1:7038;
            set $api_host     $host;
            set $api_referer  $http_referer;
            set $api_origin   $http_origin;
            if ($portal_ref = "eflow") {
                set $api_upstream https://10.100.20.8:28001;
                set $api_host     10.100.20.8:28001;
                set $api_referer  https://10.100.20.8:28001/;
                set $api_origin   $portal_origin_rewritten;
            }
            # my_app 自己的端点即使在门户页面里被引用（如自动填表脚本
            # /api/portals/inject.js）也必须回本机，否则会被上面规则误转给门户上游 → 501
            if ($uri ~ ^/api/portals/) {
                set $api_upstream http://127.0.0.1:7038;
                set $api_host     $host;
            }
            proxy_pass         $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $api_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Referer           $api_referer;
            proxy_set_header   Origin            $api_origin;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # 门户上游需要的修正（对 my_app 无影响：无 10.100.20.8 的域、my_app 不发 secure cookie）
            proxy_ssl_verify   off;
            proxy_ssl_server_name on;
            proxy_cookie_domain 10.100.20.8 $host;
            proxy_cookie_flags   ~ nosecure;
            proxy_hide_header    Strict-Transport-Security;
            proxy_hide_header    Content-Encoding;
        }

        # ---- Ollama：http://localhost/ollama/ ----
        location /ollama/ {
            proxy_pass         http://127.0.0.1:11434/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            # 关闭缓冲：流式（逐 token）输出实时下推，不攒块
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- OpenClaw 网关：http://localhost/openclaw/ ----
        location /openclaw/ {
            proxy_pass         http://127.0.0.1:18789/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            # 关闭缓冲：SSE/流式响应实时下推
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- uniplam 数据看板：http://localhost/uniplam/ ----
        # 应用 Vite base 已设为 /uniplam/，故 proxy_pass 末尾不加斜杠、不剥前缀，
        # 原样把 /uniplam/... 转给 9267 的 vite dev server。
        location /uniplam/ {
            proxy_pass         http://127.0.0.1:9267;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- my-finebi：http://localhost/my-finebi/ ----
        location /my-finebi/ {
            proxy_pass         http://127.0.0.1:7138;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }


    # -------------------------------------------------------------------------
    # 想加更多服务，复制下面模板，改 location 路径和 proxy_pass 端口即可：
    #
    # location /<名字>/ {
    #     proxy_pass         http://127.0.0.1:<端口>/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   Upgrade           $http_upgrade;
    #     proxy_set_header   Connection        "upgrade";
    #     proxy_read_timeout 3600s;    # 有 WebSocket/长连接必加（默认 60s 会断）
    #     proxy_buffering    off;      # 有流式输出(SSE/逐token)必加
    # }
    # 同时加一条无尾斜杠跳转：
    # location = /<名字> { return 301 /<名字>/; }
    # -------------------------------------------------------------------------

    # ---- 门户独立端口反代（8081=ZTE UME 8082=CCN 8083=iPRAN 8084=MW 8085=FW 8086=VMAX）----
    include portal_ports.conf;

}
