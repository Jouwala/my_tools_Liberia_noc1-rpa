# ---- 8086 VMAX CXO 经营看板 ----
server {
    listen       8086;
    server_name  _;
    location = /api/portals/inject.js {
        proxy_pass http://127.0.0.1:7038;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass          https://10.123.255.12:26180;
        proxy_ssl_verify    off;
        proxy_ssl_server_name on;
        proxy_http_version  1.1;
        proxy_set_header Host              10.123.255.12:26180;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Origin            "";
        proxy_set_header Accept-Encoding   "";
        # VMAX 校验 Referer 必须是上游自身地址（实测：Referer 带 192.168.100.20 → 403，
        # 指向上游 → 200），故伪装 Referer 为门户自己的页面
        proxy_set_header Referer           https://10.123.255.12:26180/rdk/app/portal/web/index.html;
        proxy_cookie_domain 10.123.255.12 $host;
        proxy_cookie_flags  ~ nosecure samesite=lax;
        proxy_redirect      https://10.123.255.12:26180/ http://$host:8086/;
        proxy_hide_header   Strict-Transport-Security;
        proxy_hide_header   Content-Security-Policy;
        proxy_hide_header   X-Frame-Options;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        sub_filter '</head>' '<script src="/api/portals/inject.js?system=vmax_cxo"></script></head>';
    }
}
